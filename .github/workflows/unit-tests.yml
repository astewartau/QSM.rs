name: Unit Tests

on:
  workflow_call:
    outputs:
      coverage:
        description: "Code coverage percentage"
        value: ${{ jobs.run.outputs.coverage }}
      tests_passed:
        description: "Number of tests passed"
        value: ${{ jobs.run.outputs.tests_passed }}

# See integration-tests.yml for why.
defaults:
  run:
    shell: bash

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
      tests_passed: ${{ steps.tests.outputs.tests_passed }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-llvm-cov-${{ hashFiles('**/Cargo.lock') }}
          # Falls back to the old tarpaulin-era cache for the registry and the plain debug build.
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Typechecks every target, including examples/ and the integration tests
      # in tests/, which nothing else in CI compiles: integration-tests.yml
      # builds individual `--test` targets behind a detect-changes gate, so a
      # test file or example that stops compiling can otherwise go unnoticed.
      # Needs the ONNX feature stack: the two model-driven examples declare
      # `required-features = ["onnx"]`, and tests/models_onnx.rs has
      # `download`-gated code. Not `-D warnings`; this is a compile gate.
      - name: Check all targets compile
        run: cargo check --all-targets --features "parallel onnx download"

      # Gates on `-D warnings`, so every clippy and rustc lint is a build failure, not a
      # line of scrollback nobody reads. The crate-wide exceptions are two lints that were
      # judged wrong for this code rather than fixed; they live in `[lints.clippy]` in
      # `Cargo.toml` with the reasoning next to them, and that is the only place they should
      # be added. Everything else is expected to be fixed, and a local `#[allow]` needs a
      # comment saying why -- an undocumented allow is worse than a warning, because it
      # looks settled.
      #
      # `--all-targets` matters as much as the lint level: the `#[cfg(test)]` blocks and the
      # integration tests under `tests/` are where the findings were. A plain `cargo clippy`
      # lints none of them, and `--lib` alone passed on day one while missing every one of
      # the five errors that existed when this gate was first added.
      #
      # Why the level was tightened from deny-only to `-D warnings` (#148): the vacuous
      # assertion that motivated the gate, `assert!(w <= 255)` on a `u8`, is
      # `absurd_extreme_comparisons` and deny-level. Its close sibling `assert!(true)` is
      # `assertions_on_constants` and only warn-level, so the deny-only gate exits 0 on it.
      # Both are tests that cannot fail; only this level catches both. Measured, not assumed.
      #
      # Note that this gate's strictness tracks whatever `stable` resolves to, so a Rust
      # release can turn it red with no change to this repository. That is not hypothetical:
      # clippy 1.99 added `GOLDEN_RATIO` to `approx_constant` and so newly flagged a
      # golden-section search constant that had been merged for weeks. When it happens, fix
      # or `#[allow]` the new lint with a comment -- do not pin the toolchain, which trades a
      # visible occasional failure for an invisible permanent one.
      - name: Clippy
        run: cargo clippy --all-targets --features "parallel onnx download" -- -D warnings

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # One parallel, instrumented test run that both gates and measures. It used to be two:
      # `cargo test --lib` (~3 min) to gate, then cargo-tarpaulin (~7 min) under `|| true` and
      # `--test-threads 1` for coverage, so every test ran twice. cargo-llvm-cov exits non-zero
      # when a test fails, and `shell: bash` runs with `-o pipefail`, so the `tee` does not
      # hide that. Same targets tarpaulin ran: the library's unit tests plus the non-ignored
      # tests in tests/ (doctests are not run by either).
      - name: Run unit tests with coverage
        id: tests
        run: |
          mkdir -p coverage
          cargo llvm-cov --features parallel --lcov --output-path coverage/lcov.info \
            2>&1 | tee coverage/test.log

          # Sum of "N passed" across the test binaries.
          PASSED=$(grep -oP '\d+(?= passed)' coverage/test.log | awk '{s+=$1} END {print s+0}' || true)
          echo "tests_passed=$PASSED" >> "$GITHUB_OUTPUT"

      # Line coverage of non-test code: LLVM line counts with every `#[cfg(test)]` item
      # dropped (see scripts/coverage_summary.py), which is what tarpaulin's figure excluded
      # too. The two tools still draw "coverable line" differently, so the number is close
      # to the old one but not identical.
      - name: Extract coverage
        id: coverage
        run: |
          SUMMARY=$(python3 scripts/coverage_summary.py coverage/lcov.info)
          read -r PCT COVERED COVERABLE <<< "$SUMMARY"
          COVERAGE=$(printf '%.1f' "$PCT")
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "Code coverage: ${COVERAGE}% (${COVERED}/${COVERABLE} lines)"

      - name: Enforce 90% coverage threshold
        if: steps.coverage.outcome == 'success'
        run: |
          python3 -c "
          cov = float('${{ steps.coverage.outputs.coverage }}')
          if cov < 90:
              print(f'FAIL: Coverage {cov}% is below 90% threshold')
              exit(1)
          print(f'PASS: Coverage {cov}% meets 90% threshold')
          "

  # Builds the crate for `wasm32-unknown-unknown` and runs tests/wasm_pipeline.rs under Node
  # (`wasm-bindgen-test`): every `pipeline::*` stage and every classical background-removal,
  # inversion and separation algorithm on a 16³ phantom. Browser hosts (qsmbly) run this code
  # on that target, where anything that needs what a browser does not have -- `Instant`,
  # `SystemTime`, threads, the file system -- compiles fine and panics at run time. Nothing
  # else in CI would notice; this job does. Checked by perturbation: an `Instant::now()` put
  # back on iLSQR's path fails `dipole_inversion` here with "time not implemented on this
  # platform".
  #
  # Two builds: the plain one a classical-only host makes, and the one with the deep-learning
  # stack (`onnx`, plus `simd`), which on wasm32 needs SIMD128 (see `src/models/onnx.rs`).
  # Release builds, because an unoptimised wasm build of the inversions is slow under Node.
  wasm:
    name: wasm32 (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: classical
            features: ""
            rustflags: ""
          - name: onnx simd
            features: "onnx simd"
            rustflags: "-C target-feature=+simd128"
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-${{ matrix.name }}-

      # The test runner must be the same version as the `wasm-bindgen` crate the test links.
      - name: wasm-bindgen version
        id: wbg
        run: |
          VERSION=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen-test-runner
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wbg.outputs.version }}

      # The `onnx` build also runs one deep-learning case, xQSM on weights handed over in memory
      # (`models::provide_weights`), as a browser host does. The test reads the file named by
      # `$XQSM_ONNX` through Node's `fs`; the URL and checksum come from the model registry, and
      # the file is cached under its checksum.
      - name: xQSM weights (registry entry)
        id: xqsm
        if: contains(matrix.features, 'onnx')
        run: |
          ENTRY=$(grep -A3 'name: "xqsm.onnx"' src/models/registry.rs)
          URL=$(sed -n 's/.*url: "\(.*\)",/\1/p' <<< "$ENTRY")
          SHA=$(sed -n 's/.*sha256: "\(.*\)",/\1/p' <<< "$ENTRY")
          test -n "$URL" && test -n "$SHA"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Cache xQSM weights
        if: contains(matrix.features, 'onnx')
        uses: actions/cache@v4
        with:
          path: ~/qsm-weights/xqsm.onnx
          key: xqsm-onnx-${{ steps.xqsm.outputs.sha }}

      - name: Fetch xQSM weights
        if: contains(matrix.features, 'onnx')
        run: |
          F=~/qsm-weights/xqsm.onnx
          if ! echo "${{ steps.xqsm.outputs.sha }}  $F" | sha256sum -c --status 2>/dev/null; then
            mkdir -p ~/qsm-weights
            curl -fsSL --retry 5 --retry-all-errors -o "$F" "${{ steps.xqsm.outputs.url }}"
            echo "${{ steps.xqsm.outputs.sha }}  $F" | sha256sum -c
          fi
          echo "XQSM_ONNX=$F" >> "$GITHUB_ENV"

      - name: Run the pipeline under Node
        run: cargo test --release --target wasm32-unknown-unknown --features "${{ matrix.features }}" --test wasm_pipeline
