name: Unit Tests

on:
  workflow_call:
    outputs:
      coverage:
        description: "Code coverage percentage"
        value: ${{ jobs.run.outputs.coverage }}
      tests_passed:
        description: "Number of tests passed"
        value: ${{ jobs.run.outputs.tests_passed }}

# See integration-tests.yml for why.
defaults:
  run:
    shell: bash

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
      tests_passed: ${{ steps.tests.outputs.tests_passed }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-tarpaulin-${{ hashFiles('**/Cargo.lock') }}

      # Typechecks every target, including examples/ and the integration tests
      # in tests/, which nothing else in CI compiles: integration-tests.yml
      # builds individual `--test` targets behind a detect-changes gate, so a
      # test file or example that stops compiling can otherwise go unnoticed.
      # Needs the ONNX feature stack: the two model-driven examples declare
      # `required-features = ["onnx"]`, and tests/models_onnx.rs has
      # `download`-gated code. Not `-D warnings`; this is a compile gate.
      - name: Check all targets compile
        run: cargo check --all-targets --features "parallel onnx download"

      # Gates on test failures. The tarpaulin step below cannot: it runs with
      # `|| true` because tarpaulin returns non-zero of its own accord (see
      # ed00937), and the coverage threshold is not a substitute, since a test
      # that fails every assertion still covers the lines it ran. Runs before
      # the tarpaulin install so a failure skips that build entirely.
      - name: Run unit tests
        run: cargo test --lib --features parallel

      - name: Install cargo-tarpaulin
        run: |
          if ! command -v cargo-tarpaulin &>/dev/null; then
            cargo install cargo-tarpaulin
          fi

      - name: Run unit tests with coverage
        id: tests
        run: |
          mkdir -p coverage

          # Run tarpaulin; ignore its exit code since we check coverage separately
          cargo tarpaulin --engine llvm --out json --output-dir coverage/ \
            --features parallel --skip-clean --timeout 300 -- --test-threads 1 \
            2>&1 | tee coverage/tarpaulin.log || true

          # Count passed tests from output (sum across all test suites)
          # `|| true`: tarpaulin crashing is tolerated above, and a log with no "N passed" in it
          # must stay a zero count rather than failing this step under pipefail.
          PASSED=$(grep -oP '\d+(?= passed)' coverage/tarpaulin.log | awk '{s+=$1} END {print s+0}' || true)
          echo "tests_passed=$PASSED" >> "$GITHUB_OUTPUT"

      - name: Extract coverage
        id: coverage
        run: |
          if [ ! -f coverage/tarpaulin-report.json ]; then
            echo "WARNING: tarpaulin report not found (tarpaulin may have crashed)"
            echo "coverage=0.0" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          COVERAGE=$(python3 -c "
          import json
          with open('coverage/tarpaulin-report.json') as f:
              data = json.load(f)
          if 'coverage' in data:
              cov = data['coverage']
          else:
              total = sum(f.get('coverable', 0) for f in data.get('files', []))
              covered = sum(f.get('covered', 0) for f in data.get('files', []))
              cov = (covered / total * 100) if total > 0 else 0
          print(f'{cov:.1f}')
          ")
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "Code coverage: ${COVERAGE}%"

      - name: Enforce 90% coverage threshold
        if: steps.coverage.outcome == 'success'
        run: |
          python3 -c "
          cov = float('${{ steps.coverage.outputs.coverage }}')
          if cov < 90:
              print(f'FAIL: Coverage {cov}% is below 90% threshold')
              exit(1)
          print(f'PASS: Coverage {cov}% meets 90% threshold')
          "
