      - name: Upload slices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slices-${{ matrix.test }}
          path: slices/
          retention-days: 1

  # χ-separation: one job per test binary (each runs several methods) against the
  # chisep phantom. Emits RESULT: rows (metrics as columns) + slices like the other
  # families, so it flows into the same summary comment and pass/fail gate.
  chisep-tests:
    needs: [setup-chisep, detect-changes]
    if: needs.detect-changes.outputs.run_chisep == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.detect-changes.outputs.chisep_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download chisep data
        uses: actions/download-artifact@v4
        with:
          name: chisep-data
          path: qsmci-chisep

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: .model-cache
          # Keyed on the registry, which pins every weight file's URL and SHA-256: a re-pointed
          # model gets a fresh cache, and qsm-core re-verifies whatever it restores anyway.
          key: model-weights-${{ matrix.test }}-${{ hashFiles('src/models/registry.rs') }}

      - name: Run ${{ matrix.test }}
        id: run
        timeout-minutes: 40
        # onnx + download are needed by the χ-sepnet (deep learning) binary, which
        # fetches its weights from the registry; the classical binaries ignore them.
        run: |
          # See the pipefail note on the bgremove job.
          set -o pipefail
          QSMCI_CHISEP="$PWD/qsmci-chisep" QSM_MODEL_CACHE="$PWD/.model-cache" \
            cargo test --release --features "parallel onnx download" --test ${{ matrix.test }} -- --ignored --nocapture 2>&1 | tee test_output.txt

      - name: Save metrics
        if: always()
        run: |
          if grep -q "^RESULT:" test_output.txt 2>/dev/null; then
            grep "^RESULT:" test_output.txt > ${{ matrix.test }}.csv
          else
            echo "RESULT:${{ matrix.test }},-,-,-,-" > ${{ matrix.test }}.csv
          fi
          # Outcome, not conclusion: a continue-on-error step that failed still reads "failure".
          echo "STATUS:${{ steps.run.outcome }}" >> ${{ matrix.test }}.csv

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ matrix.test }}
          path: ${{ matrix.test }}.csv
          retention-days: 1

      - name: Upload slices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slices-${{ matrix.test }}
          path: slices/
          retention-days: 1

  # Deep-learning models: one parallel job per model. Fetches ONNX weights from
  # the registry (download feature), runs on the synthetic phantom, and emits the
  # same RESULT: rows + slices as the classical algorithms. Informational — the
  # Run step is continue-on-error so a transient weight-download hiccup can't gate
  # merges (metrics fall back to a "Failed" row).
  dl-tests:
    needs: [setup, detect-changes]
    if: needs.detect-changes.outputs.run_dl == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.detect-changes.outputs.dl_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download test data
        uses: actions/download-artifact@v4
        with:
          name: test-data
          path: bids

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: .model-cache
          # Keyed on the registry, which pins every weight file's URL and SHA-256: a re-pointed
          # model gets a fresh cache, and qsm-core re-verifies whatever it restores anyway.
          key: model-weights-${{ matrix.test }}-${{ hashFiles('src/models/registry.rs') }}

      - name: Run ${{ matrix.test }}
        id: run
        continue-on-error: true
        timeout-minutes: 40
        run: |
          set -o pipefail
          # Weight downloads (OSF) can be throttled with spurious 403s when the DL matrix
          # runs concurrently; qsm-core retries internally, and this loop is a second layer.
          # The model cache persists across attempts, so a weight fetched once isn't re-downloaded.
          for attempt in 1 2 3; do
            echo "::group::${{ matrix.test }} attempt $attempt"
            if QSM_MODEL_CACHE="$PWD/.model-cache" \
              cargo test --release --features "parallel onnx download" --test dl_models ${{ matrix.test }} -- --ignored --exact --nocapture 2>&1 | tee test_output.txt; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed; backing off before retry"
            sleep $((attempt * 20))
          done
          echo "all attempts failed for ${{ matrix.test }}"
          exit 1

      - name: Save metrics
        if: always()
        run: |
          if grep -q "^RESULT:" test_output.txt 2>/dev/null; then
            grep "^RESULT:" test_output.txt > ${{ matrix.test }}.csv
          else
            echo "RESULT:${{ matrix.test }},-,-,-,-,-" > ${{ matrix.test }}.csv
          fi
          # Outcome, not conclusion: a continue-on-error step that failed still reads "failure".
          echo "STATUS:${{ steps.run.outcome }}" >> ${{ matrix.test }}.csv

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ matrix.test }}
          path: ${{ matrix.test }}.csv
          retention-days: 1

      - name: Upload slices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slices-${{ matrix.test }}
          path: slices/
          retention-days: 1

  # Gate check for branch protection — fails if any test job fails,
  # but allows skipped jobs (no relevant changes).
  # Add "tests-passed" as a required status check in branch protection rules.
  # Geometry: the cardinal-resample pathway on a synthetic sagittal anisotropic oblique
  # acquisition, which no phantom in the fixed matrices has. Its own binary rather than a row in
  # the inversion matrix because it is about the grid, not the inversion — TKD is only the vehicle.
  geometry-tests:
    needs: [setup, detect-changes]
    if: needs.detect-changes.outputs.run_geometry == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download test data
        uses: actions/download-artifact@v4
        with:
          name: test-data
          path: bids

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run oblique_sagittal
        id: run
        timeout-minutes: 30
        run: |
          # See the pipefail note on the bgremove job.
          set -o pipefail
          cargo test --release --features parallel --test oblique_sagittal -- --ignored --nocapture 2>&1 | tee test_output.txt

      - name: Save metrics
        if: always()
        run: |
          { grep "^RESULT:" test_output.txt 2>/dev/null || true; } > oblique_sagittal.csv
          echo "STATUS:${{ steps.run.outcome }}" >> oblique_sagittal.csv

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-oblique_sagittal
          path: oblique_sagittal.csv
          retention-days: 1

      - name: Upload slices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slices-oblique_sagittal
          path: slices/
          retention-days: 1

  multislice-tests:
    needs: [setup, detect-changes]
    if: needs.detect-changes.outputs.run_multislice == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download test data
        uses: actions/download-artifact@v4
        with:
          name: test-data
          path: bids

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # The 2D multi-slice sessions (ses-thick / ses-offsets / ses-gap, from
      # qsm-forward's examples/multislice_2d.py) are not yet in the phantom bundle.
      # Until they are, each test prints why it skipped and the step says so loudly
      # rather than reporting a silent pass.
      - name: Run multislice_2d
        id: run
        timeout-minutes: 30
        env:
          QSM_BIDS_2D: bids
        run: |
          # Without this the step reports tee's exit status and the job cannot fail.
          # Verified: `bash -e` on `false | tee x` exits 0, and exits 1 with pipefail set.
          set -o pipefail
          cargo test --release --features parallel --test multislice_2d -- --ignored --nocapture 2>&1 | tee test_output.txt

      - name: Save metrics
        if: always()
        run: |
          { grep "^RESULT:" test_output.txt 2>/dev/null || true; } > multislice_2d.csv
          echo "STATUS:${{ steps.run.outcome }}" >> multislice_2d.csv

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-multislice_2d
          path: multislice_2d.csv
          retention-days: 1

  tests-passed:
    needs: [detect-changes, unit-tests, bgremove-tests, inversion-tests, bet-test, combined-tests, pipeline-tests, chisep-tests, dl-tests, geometry-tests, multislice-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        # dl-tests is intentionally omitted from the gate: its Run step is
        # continue-on-error (weight downloads are network-dependent and the DL
        # metrics are informational), so the job result never blocks a merge.
        # detect-changes is in the gate because its checks (every test registered, the wasm32
        # shard map) fail it, and a failed detect-changes skips every test job, which would
        # otherwise read here as a pass.
        run: |
          for result in \
            "${{ needs.detect-changes.result }}" \
            "${{ needs.unit-tests.result }}" \
            "${{ needs.bgremove-tests.result }}" \
            "${{ needs.inversion-tests.result }}" \
            "${{ needs.bet-test.result }}" \
            "${{ needs.combined-tests.result }}" \
            "${{ needs.pipeline-tests.result }}" \
            "${{ needs.chisep-tests.result }}" \
            "${{ needs.geometry-tests.result }}" \
            "${{ needs.multislice-tests.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "Test job failed or was cancelled: $result"
              exit 1
            fi
          done
          echo "All tests passed or were skipped"

  # Collect metrics from all parallel jobs and produce a single summary
  summary:
    needs: [detect-changes, unit-tests, bgremove-tests, inversion-tests, bet-test, combined-tests, pipeline-tests, chisep-tests, dl-tests, geometry-tests, multislice-tests]
    # Post the results comment only when something actually ran. On changes that
    # select no tests (e.g. docs-only), skip it instead of posting an empty
    # "Tests passed: N/A" comment. `always()` keeps it running even if a selected
    # test job failed (so failures are still reported).
    if: >-
      always() &&
      (needs.detect-changes.outputs.run_unit_tests == 'true' ||
      needs.detect-changes.outputs.run_bgremove == 'true' ||
      needs.detect-changes.outputs.run_inversion == 'true' ||
      needs.detect-changes.outputs.run_bet == 'true' ||
      needs.detect-changes.outputs.run_combined == 'true' ||
      needs.detect-changes.outputs.run_pipeline == 'true' ||
      needs.detect-changes.outputs.run_chisep == 'true' ||
      needs.detect-changes.outputs.run_dl == 'true' ||
      needs.detect-changes.outputs.run_geometry == 'true' ||
      needs.detect-changes.outputs.run_multislice == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all metrics
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: metrics-*
          merge-multiple: true
          path: metrics

      - name: Download all slices
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: slices-*
          merge-multiple: true
          path: slices

      - name: Ensure directories exist
        run: mkdir -p metrics slices figures

      - name: Generate metrics summary
        env:
          COVERAGE: ${{ needs.unit-tests.outputs.coverage }}
          TESTS_PASSED: ${{ needs.unit-tests.outputs.tests_passed }}
        # Same report as the PR comment, without the figures: scripts/integration_report.sh.
        run: bash scripts/integration_report.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Render figures
        # Deliberately NOT continue-on-error: the PR comment's figures are now three stage
        # montages rather than ~50 individual images, so a renderer crash would silently
        # empty the comment instead of dropping one picture. Fail loudly instead.
        run: |
          if [ -n "$(ls slices/ 2>/dev/null)" ]; then
            pip install matplotlib numpy
            python scripts/render_slices.py slices figures
          fi

      - name: Setup Node.js (canvas@2 needs prebuilt binary)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup CML
        uses: iterative/setup-cml@v3
        # The PR results comment is informational; the real pass/fail gate is the
        # `tests-passed` job. Don't let a transient GitHub API rate-limit here
        # (CML / comment posting) fail the whole run.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload figures
        # Kept with the run, so the comment can point here if the image host is down.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: figures/
          if-no-files-found: ignore

      - name: Post PR comment with results
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COVERAGE: ${{ needs.unit-tests.outputs.coverage }}
          TESTS_PASSED: ${{ needs.unit-tests.outputs.tests_passed }}
        run: |
          bash scripts/integration_report.sh --figures > report.md
          bash scripts/post_pr_comment.sh report.md
