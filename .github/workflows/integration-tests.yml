          fi

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-test_bet
          path: test_bet.csv
          retention-days: 1

      - name: Upload slices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slices-test_bet
          path: slices/
          retention-days: 1

  combined-tests:
    needs: [setup, detect-changes]
    if: needs.detect-changes.outputs.run_combined == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.detect-changes.outputs.combined_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download test data
        uses: actions/download-artifact@v4
        with:
          name: test-data
          path: bids

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run ${{ matrix.test }}
        # QSMART tests still run and report metrics/figures, but don't gate merges:
        # QSMART has a known ~0.39 corr (below the 0.5 target) pending accuracy work.
        continue-on-error: ${{ contains(matrix.test, 'qsmart') }}
        timeout-minutes: 30
        run: |
          cargo test --release --features parallel --test integration_tests ${{ matrix.test }} -- --ignored --exact --nocapture 2>&1 | tee test_output.txt

      - name: Save metrics
        if: always()
        run: |
          if grep -q "^RESULT:" test_output.txt 2>/dev/null; then
            grep "^RESULT:" test_output.txt > ${{ matrix.test }}.csv
          else
            echo "RESULT:${{ matrix.test }},-,-,-,-,-" > ${{ matrix.test }}.csv
          fi

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ matrix.test }}
          path: ${{ matrix.test }}.csv
          retention-days: 1

      - name: Upload slices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slices-${{ matrix.test }}
          path: slices/
          retention-days: 1

  pipeline-tests:
    needs: [setup, detect-changes]
    if: needs.detect-changes.outputs.run_pipeline == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.detect-changes.outputs.pipeline_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download test data
        uses: actions/download-artifact@v4
        with:
          name: test-data
          path: bids

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run ${{ matrix.test }}
        # QSMART tests still run and report metrics/figures, but don't gate merges:
        # QSMART has a known ~0.39 corr (below the 0.5 target) pending accuracy work.
        continue-on-error: ${{ contains(matrix.test, 'qsmart') }}
        timeout-minutes: 30
        run: |
          cargo test --release --features parallel --test integration_tests ${{ matrix.test }} -- --ignored --exact --nocapture 2>&1 | tee test_output.txt

      - name: Save metrics
        if: always()
        run: |
          if grep -q "^RESULT:" test_output.txt 2>/dev/null; then
            grep "^RESULT:" test_output.txt > ${{ matrix.test }}.csv
          else
            echo "RESULT:${{ matrix.test }},-,-,-,-,-" > ${{ matrix.test }}.csv
          fi

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ matrix.test }}
          path: ${{ matrix.test }}.csv
          retention-days: 1

      - name: Upload slices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slices-${{ matrix.test }}
          path: slices/
          retention-days: 1

  # χ-separation: one job per test binary (each runs several methods) against the
  # chisep phantom. Emits RESULT: rows (metrics as columns) + slices like the other
  # families, so it flows into the same summary comment and pass/fail gate.
  chisep-tests:
    needs: [setup-chisep, detect-changes]
    if: needs.detect-changes.outputs.run_chisep == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.detect-changes.outputs.chisep_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download chisep data
        uses: actions/download-artifact@v4
        with:
          name: chisep-data
          path: qsmci-chisep

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run ${{ matrix.test }}
        timeout-minutes: 40
        # onnx + download are needed by the χ-sepnet (deep learning) binary, which
        # fetches its weights from the registry; the classical binaries ignore them.
        run: |
          QSMCI_CHISEP="$PWD/qsmci-chisep" QSM_MODEL_CACHE="$PWD/.model-cache" \
            cargo test --release --features "parallel onnx download" --test ${{ matrix.test }} -- --ignored --nocapture 2>&1 | tee test_output.txt

      - name: Save metrics
        if: always()
        run: |
          if grep -q "^RESULT:" test_output.txt 2>/dev/null; then
            grep "^RESULT:" test_output.txt > ${{ matrix.test }}.csv
          else
            echo "RESULT:${{ matrix.test }},-,-,-,-" > ${{ matrix.test }}.csv
          fi

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ matrix.test }}
          path: ${{ matrix.test }}.csv
          retention-days: 1

      - name: Upload slices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slices-${{ matrix.test }}
          path: slices/
          retention-days: 1

  # Deep-learning models: one parallel job per model. Fetches ONNX weights from
  # the registry (download feature), runs on the synthetic phantom, and emits the
  # same RESULT: rows + slices as the classical algorithms. Informational — the
  # Run step is continue-on-error so a transient weight-download hiccup can't gate
  # merges (metrics fall back to a "Failed" row).
  dl-tests:
    needs: [setup, detect-changes]
    if: needs.detect-changes.outputs.run_dl == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.detect-changes.outputs.dl_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download test data
        uses: actions/download-artifact@v4
        with:
          name: test-data
          path: bids

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run ${{ matrix.test }}
        continue-on-error: true
        timeout-minutes: 40
        run: |
          QSM_MODEL_CACHE="$PWD/.model-cache" \
            cargo test --release --features "parallel onnx download" --test dl_models ${{ matrix.test }} -- --ignored --exact --nocapture 2>&1 | tee test_output.txt

      - name: Save metrics
        if: always()
        run: |
          if grep -q "^RESULT:" test_output.txt 2>/dev/null; then
            grep "^RESULT:" test_output.txt > ${{ matrix.test }}.csv
          else
            echo "RESULT:${{ matrix.test }},-,-,-,-,-" > ${{ matrix.test }}.csv
          fi

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ matrix.test }}
          path: ${{ matrix.test }}.csv
          retention-days: 1

      - name: Upload slices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slices-${{ matrix.test }}
          path: slices/
          retention-days: 1

  # Gate check for branch protection — fails if any test job fails,
  # but allows skipped jobs (no relevant changes).
  # Add "tests-passed" as a required status check in branch protection rules.
  tests-passed:
    needs: [unit-tests, bgremove-tests, inversion-tests, bet-test, combined-tests, pipeline-tests, chisep-tests, dl-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        # dl-tests is intentionally omitted from the gate: its Run step is
        # continue-on-error (weight downloads are network-dependent and the DL
        # metrics are informational), so the job result never blocks a merge.
        run: |
          for result in \
            "${{ needs.unit-tests.result }}" \
            "${{ needs.bgremove-tests.result }}" \
            "${{ needs.inversion-tests.result }}" \
            "${{ needs.bet-test.result }}" \
            "${{ needs.combined-tests.result }}" \
            "${{ needs.pipeline-tests.result }}" \
            "${{ needs.chisep-tests.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "Test job failed or was cancelled: $result"
              exit 1
            fi
          done
          echo "All tests passed or were skipped"

  # Collect metrics from all parallel jobs and produce a single summary
  summary:
    needs: [detect-changes, unit-tests, bgremove-tests, inversion-tests, bet-test, combined-tests, pipeline-tests, chisep-tests, dl-tests]
    # Post the results comment only when something actually ran. On changes that
    # select no tests (e.g. docs-only), skip it instead of posting an empty
    # "Tests passed: N/A" comment. `always()` keeps it running even if a selected
    # test job failed (so failures are still reported).
    if: >-
      always() &&
      (needs.detect-changes.outputs.run_unit_tests == 'true' ||
      needs.detect-changes.outputs.run_bgremove == 'true' ||
      needs.detect-changes.outputs.run_inversion == 'true' ||
      needs.detect-changes.outputs.run_bet == 'true' ||
      needs.detect-changes.outputs.run_combined == 'true' ||
      needs.detect-changes.outputs.run_pipeline == 'true' ||
      needs.detect-changes.outputs.run_chisep == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all metrics
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: metrics-*
          merge-multiple: true
          path: metrics

      - name: Download all slices
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: slices-*
          merge-multiple: true
          path: slices

      - name: Ensure directories exist
        run: mkdir -p metrics slices figures

      - name: Generate metrics summary
        env:
          COVERAGE: ${{ needs.unit-tests.outputs.coverage }}
          TESTS_PASSED: ${{ needs.unit-tests.outputs.tests_passed }}
        run: |
          # Helper: emit a metrics table for background removal tests (RMSE/NRMSE/Corr/XSIM)
          emit_table() {
            local prefix="$1"; shift
            local has_any=false
            for test in "$@"; do
              [ -f "metrics/${prefix}${test}.csv" ] && has_any=true
            done
            [ "$has_any" = false ] && return 1

            echo "| Method | RMSE | NRMSE (range) | NRMSE% (χ) | Correlation | XSIM | Time |"
            echo "|--------|------|---------------|------------|-------------|------|------|"
            for test in "$@"; do
              file="metrics/${prefix}${test}.csv"
              if [ -f "$file" ]; then
                line=$(grep "^RESULT:" "$file" | head -1 | sed 's/^RESULT://')
                IFS=',' read -r name rmse nrmse nrmse_ch corr xsim time <<< "$line"
                if [ "$rmse" = "-" ]; then
                  echo "| ${name} | :x: Failed | - | - | - | - | - |"
                else
                  echo "| ${name} | ${rmse} | ${nrmse} | ${nrmse_ch} | ${corr} | ${xsim} | $(printf '%.2fs' "$time") |"
                fi
              fi
            done
            echo ""
          }

          # Helper: emit a unified metrics table for susceptibility map tests
          # RESULT format: name,nrmse%,detrend%,tissue%,blood%,dgm%,dgm_lin,calc_dev,streak,corr,xsim,time
          emit_chi_table() {
            local prefix="$1"; shift
            local has_any=false
            for test in "$@"; do
              [ -f "metrics/${prefix}${test}.csv" ] && has_any=true
            done
            [ "$has_any" = false ] && return 1

            echo "| Method | NRMSE% | Detrend% | Tissue% | Blood% | DGM% | DGM Lin | Calc Dev | Streak | Corr | XSIM | Time |"
            echo "|--------|--------|----------|---------|--------|------|---------|----------|--------|------|------|------|"
            for test in "$@"; do
              file="metrics/${prefix}${test}.csv"
              if [ -f "$file" ]; then
                line=$(grep "^RESULT:" "$file" | head -1 | sed 's/^RESULT://')
                IFS=',' read -r name nrmse dt tissue blood dgm dgm_lin calc_dev streak corr xsim time <<< "$line"
                if [ "$nrmse" = "-" ]; then
                  echo "| ${name} | :x: Failed | - | - | - | - | - | - | - | - | - | - |"
                else
                  echo "| ${name} | ${nrmse} | ${dt} | ${tissue} | ${blood} | ${dgm} | ${dgm_lin} | ${calc_dev} | ${streak} | ${corr} | ${xsim} | $(printf '%.2fs' "$time") |"
                fi
              fi
            done
            echo ""
          }

          # Helper: emit a χ-separation table (one row per source map, metrics as
          # columns). RESULT format: label,corr,xsim,nrmse%,time
          emit_chisep_table() {
            local files=(metrics/chisep_qsmci.csv metrics/chisep_relaxometry_qsmci.csv metrics/chisep_xsepnet.csv)
            local has_any=false
            for f in "${files[@]}"; do [ -f "$f" ] && has_any=true; done
            [ "$has_any" = false ] && return 1

            echo "| Map | Correlation | XSIM | NRMSE% | Time |"
            echo "|-----|-------------|------|--------|------|"
            for f in "${files[@]}"; do
              [ -f "$f" ] || continue
              grep "^RESULT:" "$f" | sed 's/^RESULT://' \
                | while IFS=',' read -r name corr xsim nrmse time; do
                    if [ "$corr" = "-" ] || [ -z "$corr" ]; then
                      echo "| ${name} | :x: Failed | - | - | - |"
                    else
                      echo "| ${name} | ${corr} | ${xsim} | ${nrmse}% | $(printf '%.2fs' "$time") |"
                    fi
                  done
            done
            echo ""
          }

          {
            echo "# QSM-Core Test Results"
            echo ""
            echo "## Unit Tests"
            echo "- **Tests passed:** ${TESTS_PASSED:-N/A}"
            echo "- **Code coverage:** ${COVERAGE:-N/A}%"
            echo ""

            TABLE=$(emit_table "test_bgremove_" sharp resharp vsharp pdf ismv lbv) && {
              echo "## Background Field Removal"
              echo "*Compared against ground truth local field map*"
              echo ""
              echo "$TABLE"
            }

            TABLE=$(emit_table "test_pipeline_" harperella iharperella) && {
              echo "## Combined Phase Unwrapping + Background Removal"
              echo "*Compared against ground truth local field map (input: wrapped phase)*"
              echo ""
              echo "$TABLE"
            }

            TABLE=$(emit_chi_table "test_inversion_" tkd tsvd tikhonov tv rts ilsqr medi nltv ndi fansi fansi_tgv l1qsm whqsm hdqsm amp_pe) && {
              echo "## Dipole Inversion"
              echo "*Compared against ground truth susceptibility map*"
              echo ""
              echo "$TABLE"
            }

            TABLE=$(emit_chi_table "test_dl_" qsmgan lpcnn ir2qsm modl_qsm nextqsm) && {
              echo "## Deep Learning — Dipole Inversion"
              echo "*Compared against ground truth susceptibility map (NeXtQSM: total field in; others: local field in)*"
              echo ""
              echo "$TABLE"
            }

            TABLE=$(emit_table "test_dl_" iqfm) && {
              echo "## Deep Learning — Field Mapping"
              echo "*iQFM: wrapped phase → local field, vs ground truth local field*"
              echo ""
              echo "$TABLE"
            }

            if [ -f "metrics/test_bet.csv" ]; then
              echo "## Brain Extraction"
              echo "*Compared against ground truth mask*"
              echo ""
              echo "| Method | Dice | Time |"
              echo "|--------|------|------|"
              line=$(grep "^RESULT:" "metrics/test_bet.csv" | head -1 | sed 's/^RESULT://')
              IFS=',' read -r name dice _ _ _ time <<< "$line"
              if [ "$dice" = "-" ]; then
                echo "| ${name} | :x: Failed | - |"
              else
                echo "| ${name} | ${dice} | $(printf '%.2fs' "$time") |"
              fi
              echo ""
            fi

            TABLE=$(emit_chi_table "test_combined_" tgv tfi) && {
              echo "## Combined Background Removal + Dipole Inversion"
              echo "*Compared against ground truth susceptibility map (input: total field map)*"
              echo ""
              echo "$TABLE"
            }

            TABLE=$(emit_chi_table "test_pipeline_" tgv qsmart qsmart_tikhonov) && {
              echo "## Full Pipeline"
              echo "*Compared against ground truth susceptibility map*"
              echo ""
              echo "$TABLE"
            }

            if [ -f "metrics/test_bias_correction.csv" ] || [ -f "metrics/test_swi.csv" ] || [ -f "metrics/test_r2star_t2star.csv" ]; then
              echo "## Utilities"
              echo ""
              echo "| Method | Time |"
              echo "|--------|------|"
              if [ -f "metrics/test_bias_correction.csv" ]; then
                line=$(grep "^RESULT:" "metrics/test_bias_correction.csv" | head -1 | sed 's/^RESULT://')
                IFS=',' read -r name _ _ _ _ time <<< "$line"
                echo "| ${name} | $(printf '%.2fs' "$time") |"
              fi
              if [ -f "metrics/test_swi.csv" ]; then
                line=$(grep "^RESULT:" "metrics/test_swi.csv" | head -1 | sed 's/^RESULT://')
                IFS=',' read -r name _ _ _ _ time <<< "$line"
                echo "| ${name} | $(printf '%.2fs' "$time") |"
              fi
              if [ -f "metrics/test_r2star_t2star.csv" ]; then
                line=$(grep "^RESULT:" "metrics/test_r2star_t2star.csv" | head -1 | sed 's/^RESULT://')
                IFS=',' read -r name _ _ _ _ time <<< "$line"
                echo "| ${name} | $(printf '%.2fs' "$time") |"
              fi
              echo ""
            fi

            TABLE=$(emit_chisep_table) && {
              echo "## χ-Separation"
              echo "*Paramagnetic (χ+) / diamagnetic (χ−) source maps vs ground truth (QSM-CI chisep phantom)*"
              echo ""
              echo "$TABLE"
            }
          } >> $GITHUB_STEP_SUMMARY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Render figures
        continue-on-error: true
        run: |
          if [ -n "$(ls slices/ 2>/dev/null)" ]; then
            pip install matplotlib numpy
            python scripts/render_slices.py slices figures
          fi

      - name: Setup Node.js (canvas@2 needs prebuilt binary)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup CML
        uses: iterative/setup-cml@v3
        # The PR results comment is informational; the real pass/fail gate is the
        # `tests-passed` job. Don't let a transient GitHub API rate-limit here
        # (CML / comment posting) fail the whole run.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post PR comment with results
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERAGE: ${{ needs.unit-tests.outputs.coverage }}
          TESTS_PASSED: ${{ needs.unit-tests.outputs.tests_passed }}
        run: |
          # Helper: emit a metrics table for background removal tests (RMSE/NRMSE/Corr/XSIM)
          emit_table() {
            local prefix="$1"; shift
            local has_any=false
            for test in "$@"; do
              [ -f "metrics/${prefix}${test}.csv" ] && has_any=true
            done
            [ "$has_any" = false ] && return 1

            echo "| Method | RMSE | NRMSE (range) | NRMSE% (χ) | Correlation | XSIM | Time |"
            echo "|--------|------|---------------|------------|-------------|------|------|"
            for test in "$@"; do
              file="metrics/${prefix}${test}.csv"
              if [ -f "$file" ]; then
                line=$(grep "^RESULT:" "$file" | head -1 | sed 's/^RESULT://')
                IFS=',' read -r name rmse nrmse nrmse_ch corr xsim time <<< "$line"
                if [ "$rmse" = "-" ]; then
                  echo "| ${name} | :x: Failed | - | - | - | - | - |"
                else
                  echo "| ${name} | ${rmse} | ${nrmse} | ${nrmse_ch} | ${corr} | ${xsim} | $(printf '%.2fs' "$time") |"
                fi
              fi
            done
            echo ""
          }

          # Helper: emit a unified metrics table for susceptibility map tests
          # RESULT format: name,nrmse%,detrend%,tissue%,blood%,dgm%,dgm_lin,calc_dev,streak,corr,xsim,time
          emit_chi_table() {
            local prefix="$1"; shift
            local has_any=false
            for test in "$@"; do
              [ -f "metrics/${prefix}${test}.csv" ] && has_any=true
            done
            [ "$has_any" = false ] && return 1

            echo "| Method | NRMSE% | Detrend% | Tissue% | Blood% | DGM% | DGM Lin | Calc Dev | Streak | Corr | XSIM | Time |"
            echo "|--------|--------|----------|---------|--------|------|---------|----------|--------|------|------|------|"
            for test in "$@"; do
              file="metrics/${prefix}${test}.csv"
              if [ -f "$file" ]; then
                line=$(grep "^RESULT:" "$file" | head -1 | sed 's/^RESULT://')
                IFS=',' read -r name nrmse dt tissue blood dgm dgm_lin calc_dev streak corr xsim time <<< "$line"
                if [ "$nrmse" = "-" ]; then
                  echo "| ${name} | :x: Failed | - | - | - | - | - | - | - | - | - | - |"
                else
                  echo "| ${name} | ${nrmse} | ${dt} | ${tissue} | ${blood} | ${dgm} | ${dgm_lin} | ${calc_dev} | ${streak} | ${corr} | ${xsim} | $(printf '%.2fs' "$time") |"
                fi
              fi
            done
            echo ""
          }

          # Helper: emit a χ-separation table (one row per source map, metrics as
          # columns). RESULT format: label,corr,xsim,nrmse%,time
          emit_chisep_table() {
            local files=(metrics/chisep_qsmci.csv metrics/chisep_relaxometry_qsmci.csv metrics/chisep_xsepnet.csv)
            local has_any=false
            for f in "${files[@]}"; do [ -f "$f" ] && has_any=true; done
            [ "$has_any" = false ] && return 1

            echo "| Map | Correlation | XSIM | NRMSE% | Time |"
            echo "|-----|-------------|------|--------|------|"
            for f in "${files[@]}"; do
              [ -f "$f" ] || continue
              grep "^RESULT:" "$f" | sed 's/^RESULT://' \
                | while IFS=',' read -r name corr xsim nrmse time; do
                    if [ "$corr" = "-" ] || [ -z "$corr" ]; then
                      echo "| ${name} | :x: Failed | - | - | - |"
                    else
                      echo "| ${name} | ${corr} | ${xsim} | ${nrmse}% | $(printf '%.2fs' "$time") |"
                    fi
                  done
            done
            echo ""
          }

          # Helper: emit figures for a list of slugs
          emit_figures() {
            for slug in "$@"; do
              if [ -f "figures/${slug}.png" ]; then
                echo "![${slug}](figures/${slug}.png)"
                echo ""
              fi
            done
          }

          {
            echo "## QSM-Core Test Results"
            echo ""
            echo "### Unit Tests"
            echo "- **Tests passed:** ${TESTS_PASSED:-N/A}"
            echo "- **Code coverage:** ${COVERAGE:-N/A}%"
            echo ""

            TABLE=$(emit_table "test_bgremove_" sharp resharp vsharp pdf ismv lbv) && {
              echo "### Background Field Removal"
              echo "*Compared against ground truth local field map*"
              echo ""
              echo "$TABLE"
              echo ""
              emit_figures bgremove_sharp bgremove_resharp bgremove_vsharp bgremove_pdf bgremove_ismv bgremove_lbv
            }

            TABLE=$(emit_table "test_pipeline_" harperella iharperella) && {
              echo "### Combined Phase Unwrapping + Background Removal"
              echo "*Compared against ground truth local field map (input: wrapped phase)*"
              echo ""
              echo "$TABLE"
              echo ""
              emit_figures pipeline_harperella pipeline_iharperella
            }

            TABLE=$(emit_chi_table "test_inversion_" tkd tsvd tikhonov tv rts ilsqr medi nltv ndi fansi fansi_tgv l1qsm whqsm hdqsm amp_pe) && {
              echo "### Dipole Inversion"
              echo "*Compared against ground truth susceptibility map*"
              echo ""
              echo "$TABLE"
              echo ""
              emit_figures inversion_tkd inversion_tsvd inversion_tikhonov inversion_tv inversion_rts inversion_ilsqr inversion_medi inversion_nltv inversion_ndi inversion_fansi inversion_fansi_tgv inversion_l1qsm inversion_whqsm inversion_hdqsm inversion_amp_pe
            }

            TABLE=$(emit_chi_table "test_dl_" qsmgan lpcnn ir2qsm modl_qsm nextqsm) && {
              echo "### Deep Learning — Dipole Inversion"
              echo "*Compared against ground truth susceptibility map (NeXtQSM: total field in; others: local field in)*"
              echo ""
              echo "$TABLE"
              echo ""
              emit_figures dl_qsmgan dl_lpcnn dl_ir2qsm dl_modl_qsm dl_nextqsm
            }

            TABLE=$(emit_table "test_dl_" iqfm) && {
              echo "### Deep Learning — Field Mapping"
              echo "*iQFM: wrapped phase → local field, compared against ground truth local field*"
              echo ""
              echo "$TABLE"
              echo ""
              emit_figures dl_iqfm
            }

            if [ -f "metrics/test_bet.csv" ]; then
              echo "### Brain Extraction"
              echo "*Compared against ground truth mask*"
              echo ""
              echo "| Method | Dice | Time |"
              echo "|--------|------|------|"
              line=$(grep "^RESULT:" "metrics/test_bet.csv" | head -1 | sed 's/^RESULT://')
              IFS=',' read -r name dice _ _ _ time <<< "$line"
              if [ "$dice" = "-" ]; then
                echo "| ${name} | :x: Failed | - |"
              else
                echo "| ${name} | ${dice} | $(printf '%.2fs' "$time") |"
              fi
              echo ""
              emit_figures bet
            fi

            if [ -f "slices/pipeline_romeo_b0.bin" ]; then
              echo "### Phase Unwrapping + B0 Estimation"
              echo "*MCPC-3D-S + ROMEO → total field map (compared against ground truth B0)*"
              echo ""
              emit_figures pipeline_romeo_b0
              echo ""
            fi

            TABLE=$(emit_chi_table "test_combined_" tgv tfi) && {
              echo "### Combined Background Removal + Dipole Inversion"
              echo "*Compared against ground truth susceptibility map (input: total field map)*"
              echo ""
              echo "$TABLE"
              echo ""
              emit_figures combined_tgv combined_tfi
            }

            TABLE=$(emit_chi_table "test_pipeline_" tgv qsmart qsmart_tikhonov) && {
              echo "### Full Pipeline"
              echo "*Compared against ground truth susceptibility map*"
              echo ""
              echo "$TABLE"
              echo ""
              emit_figures pipeline_tgv pipeline_qsmart pipeline_qsmart_tikhonov
            }

            if [ -f "metrics/test_bias_correction.csv" ] || [ -f "metrics/test_swi.csv" ] || [ -f "metrics/test_r2star_t2star.csv" ]; then
              echo "### Utilities"
              echo ""
              echo "| Method | Time |"
              echo "|--------|------|"
              if [ -f "metrics/test_bias_correction.csv" ]; then
                line=$(grep "^RESULT:" "metrics/test_bias_correction.csv" | head -1 | sed 's/^RESULT://')
                IFS=',' read -r name _ _ _ _ time <<< "$line"
                echo "| ${name} | $(printf '%.2fs' "$time") |"
              fi
              if [ -f "metrics/test_swi.csv" ]; then
                line=$(grep "^RESULT:" "metrics/test_swi.csv" | head -1 | sed 's/^RESULT://')
                IFS=',' read -r name _ _ _ _ time <<< "$line"
                echo "| ${name} | $(printf '%.2fs' "$time") |"
              fi
              if [ -f "metrics/test_r2star_t2star.csv" ]; then
                line=$(grep "^RESULT:" "metrics/test_r2star_t2star.csv" | head -1 | sed 's/^RESULT://')
                IFS=',' read -r name _ _ _ _ time <<< "$line"
                echo "| ${name} | $(printf '%.2fs' "$time") |"
              fi
              echo ""
              emit_figures bias_correction swi swi_mip r2star t2star
            fi

            TABLE=$(emit_chisep_table) && {
              echo "### χ-Separation"
              echo "*Paramagnetic (χ+) / diamagnetic (χ−) source maps vs ground truth (QSM-CI chisep phantom)*"
              echo ""
              echo "$TABLE"
              echo ""
              emit_figures chisep_para chisep_dia \
                chisep_xsepnet_para chisep_xsepnet_dia \
                relaxchisep_r2starqsm_para relaxchisep_r2starqsm_dia \
                relaxchisep_wavesep_para relaxchisep_wavesep_dia \
                relaxchisep_decompose_para relaxchisep_decompose_dia \
                relaxchisep_hcchisep_para relaxchisep_hcchisep_dia
            }
          } > report.md
          # Retry with backoff — `cml comment create` hits the GitHub API and can be
          # throttled (rate limit shared across concurrent runs). Best-effort: the
          # step is continue-on-error, so a persistent throttle won't fail the run.
          for attempt in 1 2 3 4 5; do
            if cml comment create report.md; then
              echo "PR comment posted (attempt $attempt)."
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              wait=$((attempt * 30))
              echo "cml comment create failed (attempt $attempt); retrying in ${wait}s..."
              sleep "$wait"
            else
              echo "cml comment create still failing after $attempt attempts; giving up (non-fatal)."
            fi
          done
