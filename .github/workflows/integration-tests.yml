name: Integration Tests

on:
  pull_request:
    branches: [main, master]
    # `labeled` so that adding the `run-all-tests` label runs the whole suite on the PR (and posts
    # the full results comment). Any other label re-runs the ordinary path-based selection, which
    # is correct, if redundant.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:  # Manual trigger: runs everything (no PR comment; results in the job summary)

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  # A test that gives up for want of data prints `ok` and reports the same green tick as a test
  # that did the work. `multislice_2d` passed that way for its whole life — five tests in 0.00s —
  # because the sessions it needed were missing from the phantom bundle, and the job only emitted
  # a warning, which gates nothing. CI fetches the bundle before the tests run, so a skip here
  # means the data did not arrive. This makes that a failure instead, for every job in this file
  # and for jobs added later.
  QSM_REQUIRE_TEST_DATA: 1

# Every `run:` step gets `bash --noprofile --norc -eo pipefail {0}`. Without `pipefail` a step
# reports the exit status of the *last* command in a pipeline, so `cargo test ... | tee log`
# reports tee's status, which is always 0, and a failing test is green. Seven steps in this file
# had that defect and two more were added on feature branches within days of each other, each
# copied from a neighbour -- so fixing the instances leaves the pattern that produced them.
# Setting it here means the next step added is guarded whether or not its author thinks about it.
#
# Pipelines whose non-zero exits are expected are guarded individually with `|| true` and say so.
defaults:
  run:
    shell: bash

jobs:
  # Detect which source files changed and map to affected tests
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      run_unit_tests: ${{ steps.detect.outputs.run_unit_tests }}
      run_bgremove: ${{ steps.detect.outputs.run_bgremove }}
      bgremove_matrix: ${{ steps.detect.outputs.bgremove_matrix }}
      run_inversion: ${{ steps.detect.outputs.run_inversion }}
      inversion_matrix: ${{ steps.detect.outputs.inversion_matrix }}
      run_bet: ${{ steps.detect.outputs.run_bet }}
      run_combined: ${{ steps.detect.outputs.run_combined }}
      combined_matrix: ${{ steps.detect.outputs.combined_matrix }}
      run_pipeline: ${{ steps.detect.outputs.run_pipeline }}
      pipeline_matrix: ${{ steps.detect.outputs.pipeline_matrix }}
      run_chisep: ${{ steps.detect.outputs.run_chisep }}
      chisep_matrix: ${{ steps.detect.outputs.chisep_matrix }}
      run_dl: ${{ steps.detect.outputs.run_dl }}
      dl_matrix: ${{ steps.detect.outputs.dl_matrix }}
      run_geometry: ${{ steps.detect.outputs.run_geometry }}
      run_multislice: ${{ steps.detect.outputs.run_multislice }}
      wasm_shards: ${{ steps.wasm.outputs.wasm_shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A test that no `all_*` list names is never run by this workflow, whatever changes — the
      # gap this closes is a test added to a file and never registered. Each #[ignore] test in
      # the matrix-driven files must be in one list (or in `not_in_ci`, with a reason there), and
      # each chisep_*.rs binary with ignored tests must be in all_chisep.
      - name: Check every test is registered
        run: |
          wf=.github/workflows/integration-tests.yml
          registered=$(grep -oE "^ +all_[a-z]+='\[[^']*\]'" "$wf" | sed -E "s/^[^']*'//; s/'$//" | jq -r '.[]')
          registered="$registered $(sed -nE 's/^ +not_in_ci="([^"]*)"/\1/p' "$wf")"
          registered="$registered test_bet"   # its own job, bet-test
          missing=""
          for f in tests/integration_tests.rs tests/dl_models.rs; do
            for t in $(awk '/#\[ignore/{ig=1; next} ig && /fn [a-z0-9_]+\(/{match($0,/fn [a-z0-9_]+/); print substr($0,RSTART+3,RLENGTH-3); ig=0; next} /^[[:space:]]*#\[/{next} {ig=0}' "$f"); do
              echo " $registered " | tr '\n' ' ' | grep -qw -- "$t" || missing="$missing $f::$t"
            done
          done
          for f in tests/chisep_*.rs; do
            b=$(basename "$f" .rs)
            [ "$b" = chisep_integration ] && continue   # forward-phantom variant, run locally only
            grep -q '#\[ignore' "$f" || continue
            echo " $registered " | tr '\n' ' ' | grep -qw -- "$b" || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::Ignored tests that no all_* list (or not_in_ci) names, so CI never runs them:$missing"
            exit 1
          fi
          echo "All ignored integration tests are registered."

      # The wasm32 deep-learning shards of unit-tests.yml are selected from the source's module
      # graph (scripts/wasm_dl_shards.py). This fails when a file that uses the model machinery
      # is reached by no shard, or a file listed as classical has become a network's dependency,
      # so a new network cannot skip the shards that test it in WASM.
      - name: Check the wasm32 shard map
        run: |
          python3 scripts/wasm_dl_shards.py check
          python3 -m unittest discover -s scripts -p 'test_wasm_dl_shards.py'

      - name: Map changed files to tests
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -e

          # Every #[ignore] test in tests/integration_tests.rs and tests/dl_models.rs is in exactly one
          # of these lists or in `not_in_ci` below; the "Check every test is registered" step fails
          # the run otherwise, so a new test cannot be added without CI ever running it.
          all_bgremove='["test_bgremove_sharp","test_bgremove_resharp","test_bgremove_vsharp","test_bgremove_vsharp_no_deconvolve","test_bgremove_pdf","test_bgremove_ismv","test_bgremove_lbv","test_bgremove_msmv"]'
          all_inversion='["test_inversion_tkd","test_inversion_tkd_cropped","test_inversion_tsvd","test_inversion_tikhonov","test_inversion_tv","test_inversion_rts","test_inversion_ilsqr","test_inversion_star","test_inversion_medi","test_inversion_nltv","test_inversion_ndi","test_inversion_fansi","test_inversion_fansi_tgv","test_inversion_l1qsm","test_inversion_whqsm","test_inversion_hdqsm","test_inversion_amp_pe","test_inversion_lsqr","test_inversion_heidi","test_multiorient_cosmos","test_multiorient_sti","test_multiorient_coverage","test_multiorient_noise","test_multiorient_register","test_multiorient_register_capture_range"]'
          all_combined='["test_combined_tgv","test_combined_tfi"]'
          all_pipeline='["test_pipeline_romeo_b0","test_pipeline_unwrap_bfr_romeo","test_pipeline_unwrap_bfr_laplacian_neumann","test_pipeline_unwrap_bfr_bestpath","test_pipeline_unwrap_bfr_prelude","test_pipeline_unwrap_bfr_stage_laplacian","test_pipeline_tgv","test_pipeline_tgv_single_echo","test_pipeline_qsmart","test_pipeline_qsmart_tikhonov","test_pipeline_harperella","test_pipeline_iharperella","test_bias_correction","test_n4_bias_correction","test_swi","test_smwi","test_r2star_t2star","test_motion_correction","test_robust_echo_combination","test_pipeline_masking","test_pipeline_two_pass"]'
          # χ-separation entries are whole test *binaries* (each runs several methods).
          all_chisep='["chisep_qsmci","chisep_relaxometry_qsmci","chisep_xsepnet","chisep_r2primenet","chisep_orientation"]'
          # Deep-learning models (in tests/dl_models.rs; weights fetched from the registry).
          all_dl='["test_dl_qsmgan","test_dl_lpcnn","test_dl_ir2qsm","test_dl_modl_qsm","test_dl_nextqsm","test_dl_iqfm","test_dl_hdbet","test_dl_r2primenet","test_dl_xqsm","test_dl_qsmnet","test_dl_qsmnet_plus","test_dl_autoqsm","test_dl_iqsm","test_dl_iqsm_plus","test_dl_bfrnet","test_dl_mindgrab","test_dl_rs2net","test_dl_synthseg","test_dl_synthseg_window"]'
          all_dl_names=$(echo "$all_dl" | jq -r '.[]' | tr '\n' ' ')
          # Ignored tests deliberately not run here: the manual benchmark and combinatorial sweep
          # (combinatorial-tests.yml).
          not_in_ci="benchmark_all_algorithms test_all_combinations"

          run_unit_tests=false

          output_all() {
            echo "run_unit_tests=true" >> "$GITHUB_OUTPUT"
            echo "run_bgremove=true" >> "$GITHUB_OUTPUT"
            echo "bgremove_matrix=$all_bgremove" >> "$GITHUB_OUTPUT"
            echo "run_inversion=true" >> "$GITHUB_OUTPUT"
            echo "inversion_matrix=$all_inversion" >> "$GITHUB_OUTPUT"
            echo "run_bet=true" >> "$GITHUB_OUTPUT"
            echo "run_combined=true" >> "$GITHUB_OUTPUT"
            echo "combined_matrix=$all_combined" >> "$GITHUB_OUTPUT"
            echo "run_pipeline=true" >> "$GITHUB_OUTPUT"
            echo "pipeline_matrix=$all_pipeline" >> "$GITHUB_OUTPUT"
            echo "run_chisep=true" >> "$GITHUB_OUTPUT"
            echo "chisep_matrix=$all_chisep" >> "$GITHUB_OUTPUT"
            echo "run_dl=true" >> "$GITHUB_OUTPUT"
            echo "dl_matrix=$all_dl" >> "$GITHUB_OUTPUT"
            echo "run_geometry=true" >> "$GITHUB_OUTPUT"
            echo "run_multislice=true" >> "$GITHUB_OUTPUT"
          }

          # Manual trigger, or the `run-all-tests` label on the PR: run everything.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "workflow_dispatch: running all tests"
            output_all
            exit 0
          fi
          if echo "${PR_LABELS:-[]}" | jq -e 'index("run-all-tests")' >/dev/null 2>&1; then
            echo "run-all-tests label: running all tests"
            output_all
            exit 0
          fi

          # Determine diff range based on PR event type. Prefer the incremental
          # BEFORE..HEAD diff on a push, but a force-push orphans BEFORE_SHA (it's
          # no longer in the checkout), which makes the range invalid. Only use it
          # when BEFORE_SHA actually resolves; otherwise fall back to the full
          # base...head diff.
          CHANGED=""
          diff_ok=false
          if [ "$PR_ACTION" = "synchronize" ] && [ -n "$BEFORE_SHA" ] && \
             [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && \
             git rev-parse -q --verify "${BEFORE_SHA}^{commit}" >/dev/null 2>&1; then
            echo "synchronize: diffing ${BEFORE_SHA:0:8}..${HEAD_SHA:0:8}"
            if CHANGED=$(git diff --name-only "$BEFORE_SHA".."$HEAD_SHA" 2>/dev/null); then diff_ok=true; fi
          fi
          if [ "$diff_ok" != true ]; then
            echo "full diff: ${BASE_SHA:0:8}...${HEAD_SHA:0:8}"
            if CHANGED=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" 2>/dev/null); then diff_ok=true; fi
          fi

          echo "Changed files:"
          echo "$CHANGED"
          echo ""

          # Safety net: if the changed set couldn't be determined (bad revision
          # range, shallow checkout, ...), run the full suite instead of silently
          # skipping every test.
          if [ "$diff_ok" != true ] || [ -z "$CHANGED" ]; then
            echo "Could not determine changed files — running full suite as a safety net."
            output_all
            exit 0
          fi

          # A change to this workflow only needs the whole suite behind it when it changes how
          # tests are *run*. Registering one — a new `case` arm, a name added to an `all_*`
          # list, or a name appended to an existing arm's body — is picked up by the normal
          # mapping below, so it does not: the test it registers is selected by its own source
          # file changing. Anything else in the file (a job definition, a cargo invocation, a
          # features list) still fans out, and so does a diff this cannot classify.
          #
          # Arm *bodies* count, not just arm openers. Arms are routinely written across two
          # lines, with the `case` pattern on one and `inversion="$inversion ..."` on the next,
          # so registering a test there edits the body. Matching only openers made the common
          # case — adding a test name to an existing arm — fan out to the whole suite, which is
          # exactly what this check exists to avoid.
          #
          # The summary step counts as registration too. Giving a new method a row in a metrics
          # table, a panel in a montage, or a mention in a caption changes how results are
          # *reported*, never which ones are computed or whether they pass — the same reason
          # `render_*.py` is exempt above. Adding an algorithm always touches those lines, so
          # leaving them out made a full-suite run the norm for exactly the change this is meant
          # to narrow. `echo` is allowed only without a redirect, so the lines that actually
          # select tests (`echo "run_dl=true" >> "$GITHUB_OUTPUT"`) are still caught.
          workflow_registration_only=false
          if echo "$CHANGED" | grep -qx '\.github/workflows/integration-tests\.yml'; then
            # Collected into a variable rather than tested with `grep -q` at the end of the pipe:
            # `grep -q` exits at its first match, the greps upstream of it die of SIGPIPE, and under
            # pipefail that made a large diff read as "registration only" and skip the full suite.
            beyond=$(git diff "$BASE_SHA"..."$HEAD_SHA" -- .github/workflows/integration-tests.yml \
                 | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
                 | grep -vE '^[+-][[:space:]]*(#|all_[a-z_]+=|[A-Za-z0-9_./*|$-]+\)([[:space:]]|$)|[a-z_]+="\$[a-z_]+[[:space:]]|;;[[:space:]]*$|echo[[:space:]][^>]*$|emit_figures[[:space:]]|if[[:space:]]+TABLE=\$\(emit_table[[:space:]]|if[[:space:]]+\[[[:space:]]+-f[[:space:]]+"(slices|metrics|figures)/)' || true)
            if [ -n "$beyond" ]; then
              echo "integration-tests.yml: changed beyond test registration → full integration suite"
            else
              echo "integration-tests.yml: only test registration changed → mapping as usual"
              workflow_registration_only=true
            fi
          fi

          # The changed files, for the wasm32 shard selection below. A registration-only change
          # to this file is left out, as it is from the mapping here.
          echo "$CHANGED" | if [ "$workflow_registration_only" = true ]; then
            grep -vx '\.github/workflows/integration-tests\.yml' || true
          else
            cat
          fi > "$RUNNER_TEMP/changed-files"

          # Check if any Rust/CI files changed (for unit tests)
          for file in $CHANGED; do
            case "$file" in
              src/**|tests/**|Cargo.toml|Cargo.lock|.github/workflows/unit-tests.yml|.github/workflows/integration-tests.yml|scripts/coverage_summary.py)
                run_unit_tests=true; break ;;
            esac
          done

          # Whether the PR's diff of a file removes or edits any line. Not `| grep -q` at the end of
          # a pipe: it exits at its first match, the commands upstream die of SIGPIPE, and under
          # pipefail the pipeline then reads as false — "additions only" — exactly when it is not.
          has_removals() {
            [ -n "$(git diff "$BASE_SHA"..."$HEAD_SHA" -- "$1" | grep -E '^-' | grep -vE '^---' || true)" ]
          }

          # Map changed files to test names
          bgremove=""
          inversion=""
          run_bet=false
          run_geometry=false
          run_multislice=false
          combined=""
          pipeline=""
          chisep=""
          dl=""

          for file in $CHANGED; do
            case "$file" in
              # Module roots that are only declarations + re-exports (no behaviour); unit
              # tests (already selected for any src/ change) recompile the whole crate, so a
              # change to them alone needs no integration rerun. Registering a new algorithm
              # means touching its module root, so without this every such PR reran the whole
              # category — and src/pipeline/mod.rs reran the entire suite.
              # Verified declarations-only: no fn/struct/enum/impl in any of them. Deliberately
              # NOT here: src/unwrap/mod.rs (defines UnwrapMethod) and src/models/mod.rs (real
              # code), which keep their mappings.
              src/lib.rs|src/utils/mod.rs) : ;;
              src/inversion/mod.rs|src/bgremove/mod.rs|src/pipeline/mod.rs) : ;;
              # Core infrastructure → run everything
              src/grid.rs|src/fft.rs|src/region_grow.rs|src/priority_queue.rs)
                echo "Core file changed: $file → all tests"
                output_all; exit 0 ;;
              src/kernels/*|src/solvers/*)
                echo "Core file changed: $file → all tests"
                output_all; exit 0 ;;
              # ops.rs holds the shared math helpers (shrink/vec_norm/...) used
              # across the algorithms, so a change there can affect any result.
              src/utils/gradient.rs|src/utils/padding.rs|src/utils/simd_ops.rs|src/utils/ops.rs)
                echo "Core util changed: $file → all tests"
                output_all; exit 0 ;;
              # Shared test helpers (or dependency/build changes) affect every
              # test; a new standalone test file is not in the fixed integration
              # matrix, so it only needs the unit-test build (already selected).
              tests/common/*|Cargo.toml|Cargo.lock)
                echo "Shared test/build file changed: $file → all tests"
                output_all; exit 0 ;;
              .github/workflows/unit-tests.yml|scripts/coverage_summary.py)
                run_unit_tests=true ;;
              # Only the data-download script (which changes what data every test
              # sees) forces a full integration rerun. The render_*.py scripts are
              # figure-only — they change how results are drawn, not the computed
              # metrics or pass/fail — so they should not rerun the compute.
              .github/workflows/integration-tests.yml)
                if [ "$workflow_registration_only" = true ]; then
                  run_unit_tests=true
                  continue
                fi
                echo "CI file changed: $file → all integration tests"
                echo "run_bgremove=true" >> "$GITHUB_OUTPUT"
                echo "bgremove_matrix=$all_bgremove" >> "$GITHUB_OUTPUT"
                echo "run_inversion=true" >> "$GITHUB_OUTPUT"
                echo "inversion_matrix=$all_inversion" >> "$GITHUB_OUTPUT"
                echo "run_bet=true" >> "$GITHUB_OUTPUT"
                echo "run_combined=true" >> "$GITHUB_OUTPUT"
                echo "combined_matrix=$all_combined" >> "$GITHUB_OUTPUT"
                echo "run_pipeline=true" >> "$GITHUB_OUTPUT"
                echo "pipeline_matrix=$all_pipeline" >> "$GITHUB_OUTPUT"
                echo "run_chisep=true" >> "$GITHUB_OUTPUT"
                echo "chisep_matrix=$all_chisep" >> "$GITHUB_OUTPUT"
                echo "run_dl=true" >> "$GITHUB_OUTPUT"
                echo "dl_matrix=$all_dl" >> "$GITHUB_OUTPUT"
                echo "run_geometry=true" >> "$GITHUB_OUTPUT"
                echo "run_multislice=true" >> "$GITHUB_OUTPUT"
                echo "run_unit_tests=$run_unit_tests" >> "$GITHUB_OUTPUT"
                exit 0 ;;
              # Changes the data every test sees, so there is nothing to narrow it to.
              scripts/download-test-data.sh)
                echo "CI file changed: $file → all integration tests"
                output_all; exit 0 ;;

              # Background removal
              src/bgremove/smv.rs)
                bgremove="$bgremove test_bgremove_sharp test_bgremove_vsharp test_bgremove_vsharp_no_deconvolve test_bgremove_ismv test_bgremove_msmv" ;;
              src/bgremove/sharp.rs)  bgremove="$bgremove test_bgremove_sharp" ;;
              src/bgremove/resharp.rs) bgremove="$bgremove test_bgremove_resharp" ;;
              src/bgremove/vsharp.rs) bgremove="$bgremove test_bgremove_vsharp test_bgremove_vsharp_no_deconvolve test_bgremove_msmv"; pipeline="$pipeline test_pipeline_two_pass" ;;
              src/bgremove/pdf.rs)    bgremove="$bgremove test_bgremove_pdf" ;;
              src/bgremove/ismv.rs)   bgremove="$bgremove test_bgremove_ismv" ;;
              src/bgremove/lbv.rs)    bgremove="$bgremove test_bgremove_lbv" ;;
              src/bgremove/sdf.rs)    pipeline="$pipeline test_pipeline_qsmart test_pipeline_qsmart_tikhonov" ;;
              src/bgremove/msmv.rs)   bgremove="$bgremove test_bgremove_msmv" ;;
              src/bgremove/bfrnet.rs) dl="$dl test_dl_bfrnet" ;;

              # Dipole inversion
              src/inversion/admm.rs)
                inversion="$inversion test_inversion_tkd test_inversion_tsvd test_inversion_tikhonov test_inversion_tv test_inversion_rts test_inversion_ilsqr test_inversion_medi test_inversion_nltv test_inversion_ndi test_inversion_fansi test_inversion_fansi_tgv test_inversion_l1qsm test_inversion_whqsm test_inversion_hdqsm test_inversion_lsqr test_inversion_heidi test_multiorient_cosmos test_multiorient_sti test_multiorient_coverage test_multiorient_noise test_multiorient_register test_multiorient_register_capture_range"
                combined="$combined test_combined_tfi" ;;
              # oblique_sagittal inverts with TKD, so a change there moves its numbers too.
              src/inversion/tkd.rs)
                inversion="$inversion test_inversion_tkd test_inversion_tsvd test_inversion_tkd_cropped"
                run_geometry=true ;;
              src/inversion/tikhonov.rs)  inversion="$inversion test_inversion_tikhonov"; pipeline="$pipeline test_pipeline_qsmart_tikhonov" ;;
              src/inversion/tv.rs)        inversion="$inversion test_inversion_tv" ;;
              src/inversion/rts.rs)       inversion="$inversion test_inversion_rts"; pipeline="$pipeline test_pipeline_two_pass" ;;
              src/crop.rs)                inversion="$inversion test_inversion_tkd_cropped" ;;
              src/inversion/medi.rs)      inversion="$inversion test_inversion_medi"; combined="$combined test_combined_tfi" ;;
              src/inversion/tfi.rs)       combined="$combined test_combined_tfi" ;;
              src/inversion/nltv.rs)      inversion="$inversion test_inversion_nltv" ;;
              src/inversion/tgv.rs)       combined="$combined test_combined_tgv"; pipeline="$pipeline test_pipeline_tgv test_pipeline_tgv_single_echo" ;;
              src/inversion/ilsqr.rs)     inversion="$inversion test_inversion_ilsqr"; pipeline="$pipeline test_pipeline_qsmart"; chisep="$chisep chisep_qsmci" ;;
              src/inversion/star.rs)      inversion="$inversion test_inversion_star" ;;
              src/inversion/ndi.rs)       inversion="$inversion test_inversion_ndi" ;;
              src/inversion/fansi.rs)     inversion="$inversion test_inversion_fansi test_inversion_fansi_tgv" ;;
              src/inversion/l1qsm.rs)     inversion="$inversion test_inversion_l1qsm" ;;
              src/inversion/whqsm.rs)     inversion="$inversion test_inversion_whqsm" ;;
              src/inversion/hdqsm.rs)     inversion="$inversion test_inversion_hdqsm" ;;
              src/inversion/amp_pe.rs)    inversion="$inversion test_inversion_amp_pe" ;;
              src/inversion/lsqr_qsm.rs)  inversion="$inversion test_inversion_lsqr test_inversion_heidi" ;;
              src/inversion/heidi.rs)     inversion="$inversion test_inversion_heidi" ;;
              src/utils/anisotropic_diffusion.rs) inversion="$inversion test_inversion_heidi" ;;
              src/inversion/cosmos.rs)    inversion="$inversion test_multiorient_cosmos test_multiorient_coverage test_multiorient_noise test_multiorient_register" ;;
              src/inversion/sti.rs)       inversion="$inversion test_multiorient_sti" ;;
              # STI derives MMS/MSA/PEV from this eigensolver.
              src/utils/denoise.rs)       inversion="$inversion test_multiorient_sti" ;;
              # AMP-PE's sparse-wavelet + erfc helpers are used only by it; WaveSep
              # also uses the wavelet transform.
              src/utils/special.rs) inversion="$inversion test_inversion_amp_pe" ;;
              src/utils/wavelet.rs)
                inversion="$inversion test_inversion_amp_pe"
                chisep="$chisep chisep_relaxometry_qsmci" ;;

              # χ-separation (all methods share src/separation; both test binaries)
              src/separation/chisepnet.rs) chisep="$chisep chisep_xsepnet chisep_orientation" ;;
              src/separation/susep_net.rs) chisep="$chisep chisep_xsepnet" ;;
              src/utils/r2primenet.rs) chisep="$chisep chisep_r2primenet chisep_orientation"; dl="$dl test_dl_r2primenet" ;;
              # geometry.rs feeds three different things: the axis relabelling chisep_orientation
              # is built on; the cardinal-resample pathway oblique_sagittal covers, on the
              # anisotropic non-axial affine that is the only data exercising how axial_grid_for
              # assigns its spacings; and the resampling and B0-from-affine machinery the
              # registration path builds on.
              src/geometry.rs)
                chisep="$chisep chisep_orientation"
                inversion="$inversion test_multiorient_register"
                pipeline="$pipeline test_motion_correction"
                run_geometry=true ;;
              tests/oblique_sagittal.rs) run_geometry=true ;;
              # Rigid registration: the primitive that puts un-coregistered orientations on a
              # common grid and recovers their B0 directions.
              src/registration.rs)
                inversion="$inversion test_multiorient_register test_multiorient_register_capture_range"
                pipeline="$pipeline test_motion_correction" ;;
              # Image-domain motion correction: registration applied along a series, and the
              # pipeline stage that puts it in front of field mapping.
              src/motion.rs|src/pipeline/motion.rs) pipeline="$pipeline test_motion_correction" ;;
              src/utils/sliding.rs) chisep="$chisep chisep_xsepnet chisep_r2primenet" ;;
              src/separation/*) chisep="$chisep chisep_qsmci chisep_relaxometry_qsmci" ;;
              tests/chisep_qsmci.rs) chisep="$chisep chisep_qsmci" ;;
              tests/chisep_relaxometry_qsmci.rs) chisep="$chisep chisep_relaxometry_qsmci" ;;
              tests/chisep_xsepnet.rs) chisep="$chisep chisep_xsepnet" ;;
              tests/chisep_r2primenet.rs) chisep="$chisep chisep_r2primenet" ;;
              tests/chisep_orientation.rs) chisep="$chisep chisep_orientation" ;;

              # Deep-learning models (shared ONNX registry/inference + per-model glue)
              # The registry is edited whenever any single model is added or re-pointed, so fanning
              # out to every DL test on it is nearly always wasted. Map the ids whose entries
              # actually changed instead — and fall back to the full set if any of them is one this
              # mapping does not know, so a new model is never silently skipped.
              src/models/registry.rs)
                # `|| true`: no matching lines is a normal outcome under pipefail, not a failure.
                changed_ids=$(git diff "$BASE_SHA"..."$HEAD_SHA" -- src/models/registry.rs \
                  | grep -E '^[+-]' | grep -oE 'id: "[a-z0-9-]+"' \
                  | sed -E 's/id: "([a-z0-9-]+)"/\1/' | sort -u || true)
                if [ -z "$changed_ids" ]; then
                  echo "registry.rs: no model entry changed → no DL tests selected"
                else
                  for id in $changed_ids; do
                    case "$id" in
                      qsmgan)     dl="$dl test_dl_qsmgan" ;;
                      lpcnn)      dl="$dl test_dl_lpcnn" ;;
                      ir2qsm)     dl="$dl test_dl_ir2qsm" ;;
                      modl-qsm)   dl="$dl test_dl_modl_qsm" ;;
                      nextqsm)    dl="$dl test_dl_nextqsm" ;;
                      iqfm)       dl="$dl test_dl_iqfm" ;;
                      hd-bet)     dl="$dl test_dl_hdbet" ;;
                      bfrnet)     dl="$dl test_dl_bfrnet" ;;
                      xqsm)       dl="$dl test_dl_xqsm" ;;
                      qsmnet)     dl="$dl test_dl_qsmnet" ;;
                      qsmnet-plus) dl="$dl test_dl_qsmnet_plus" ;;
                      autoqsm)    dl="$dl test_dl_autoqsm" ;;
                      iqsm)       dl="$dl test_dl_iqsm" ;;
                      iqsm-plus)  dl="$dl test_dl_iqsm_plus" ;;
                      rs2-net)    dl="$dl test_dl_rs2net" ;;
                      mindgrab)   dl="$dl test_dl_mindgrab" ;;
                      # synthseg-2.0's weights are Pending (not hosted), so it has no test of its
                      # own; its entry shares the SynthSeg code path.
                      synthseg|synthseg-2.0) dl="$dl test_dl_synthseg test_dl_synthseg_window" ;;
                      r2primenet) dl="$dl test_dl_r2primenet"; chisep="$chisep chisep_r2primenet" ;;
                      chi-sepnet) chisep="$chisep chisep_xsepnet" ;;
                      susep-net)  chisep="$chisep chisep_qsmci chisep_xsepnet" ;;
                      # No dedicated test (xqsm, qsmnet, autoqsm, iqsm, synthseg, …): cover it
                      # with the full DL set rather than assume nothing needs running.
                      *) echo "registry.rs: '$id' has no mapped test → all DL tests"
                         dl="$dl $all_dl_names" ;;
                    esac
                  done
                fi ;;
              src/models/*)  dl="$dl $all_dl_names"; chisep="$chisep chisep_xsepnet chisep_r2primenet" ;;
              src/inversion/qsmgan.rs)   dl="$dl test_dl_qsmgan" ;;
              src/inversion/lpcnn.rs)    dl="$dl test_dl_lpcnn" ;;
              src/inversion/ir2qsm.rs)   dl="$dl test_dl_ir2qsm" ;;
              src/inversion/modl_qsm.rs) dl="$dl test_dl_modl_qsm" ;;
              src/inversion/nextqsm.rs)  dl="$dl test_dl_nextqsm" ;;
              src/inversion/iqfm.rs)     dl="$dl test_dl_iqfm" ;;
              src/inversion/xqsm.rs)     dl="$dl test_dl_xqsm" ;;
              src/inversion/qsmnet.rs)   dl="$dl test_dl_qsmnet test_dl_qsmnet_plus" ;;
              src/inversion/autoqsm.rs)  dl="$dl test_dl_autoqsm" ;;
              # iQFM and iQSM+ reuse iQSM's preprocessing.
              src/inversion/iqsm.rs)     dl="$dl test_dl_iqsm test_dl_iqsm_plus test_dl_iqfm" ;;
              src/inversion/iqsm_plus.rs) dl="$dl test_dl_iqsm_plus" ;;
              # The overlap-tiling the DL inversions share (their *_tiled variants).
              src/inversion/tiled.rs)    dl="$dl $all_dl_names" ;;
              # Every DL test shares this file's helpers, so a change to one of them can break the
              # rest — but a diff that only *adds* lines cannot, so adding a test runs just that
              # test. Any removal or edit falls back to the full set.
              tests/dl_models.rs)
                if has_removals tests/dl_models.rs; then
                  dl="$dl $all_dl_names"
                else
                  # `|| true`: see above.
                  added=$(git diff "$BASE_SHA"..."$HEAD_SHA" -- tests/dl_models.rs \
                    | grep -E '^\+' | grep -oE 'fn (test_dl_[a-z0-9_]+)' | sed 's/^fn //' | sort -u || true)
                  if [ -n "$added" ]; then
                    echo "dl_models.rs: additions only → $added"
                    dl="$dl $added"
                  else
                    dl="$dl $all_dl_names"
                  fi
                fi ;;

              # Brain extraction (HD-BET is a DL model: its own test in the DL matrix). RS2-Net
              # reuses HD-BET's sliding window and resampling; SynthSeg uses `resize`.
              src/bet/hdbet.rs) dl="$dl test_dl_hdbet test_dl_rs2net" ;;
              src/utils/resample.rs) dl="$dl test_dl_hdbet test_dl_synthseg test_dl_synthseg_window" ;;
              src/bet/rs2net.rs) dl="$dl test_dl_rs2net" ;;
              src/bet/mindgrab.rs) dl="$dl test_dl_mindgrab" ;;
              src/bet/*) run_bet=true; pipeline="$pipeline test_pipeline_masking" ;;

              # Segmentation
              src/segment/*) dl="$dl test_dl_synthseg test_dl_synthseg_window" ;;

              # Masking primitives: the masking stage drives all of them. Connected components are
              # also used by PRELUDE, MindGrab and SynthSeg's topology cleanup.
              src/utils/threshold.rs|src/utils/morphology.rs|src/utils/morphology/*)
                pipeline="$pipeline test_pipeline_masking test_pipeline_two_pass"; run_bet=true ;;
              src/utils/connected.rs)
                pipeline="$pipeline test_pipeline_masking test_pipeline_unwrap_bfr_prelude"
                dl="$dl test_dl_mindgrab test_dl_synthseg test_dl_synthseg_window" ;;

              # Phase unwrapping
              src/unwrap/mod.rs)      pipeline="$pipeline test_pipeline_tgv test_pipeline_qsmart test_pipeline_qsmart_tikhonov" ;;
              src/unwrap/romeo.rs)    pipeline="$pipeline test_pipeline_romeo_b0 test_pipeline_unwrap_bfr_romeo test_pipeline_tgv" ;;
              src/unwrap/bestpath.rs) pipeline="$pipeline test_pipeline_unwrap_bfr_bestpath test_pipeline_unwrap_bfr_romeo" ;;
              src/unwrap/prelude.rs)  pipeline="$pipeline test_pipeline_unwrap_bfr_prelude test_pipeline_unwrap_bfr_romeo" ;;
              # 2D multi-slice: slice-wise unwrapping and the slice-gap refusal are
              # additive, so no existing pipeline test sees them; they have their own binary.
              src/unwrap/slicewise.rs|tests/multislice_2d.rs)
                run_multislice=true ;;
              # Best path and PRELUDE are union_find's only callers.
              src/utils/union_find.rs) pipeline="$pipeline test_pipeline_unwrap_bfr_bestpath test_pipeline_unwrap_bfr_prelude" ;;
              src/unwrap/laplacian.rs) pipeline="$pipeline test_pipeline_unwrap_bfr_laplacian_neumann test_pipeline_unwrap_bfr_stage_laplacian test_pipeline_qsmart test_pipeline_qsmart_tikhonov test_pipeline_harperella test_pipeline_iharperella" ;;

              # Pipeline (combined algorithms + shared stages)
              src/pipeline/config.rs|src/pipeline/phase_utils.rs|src/pipeline/referencing.rs)
                echo "Pipeline core changed: $file → all tests"
                output_all; exit 0 ;;
              src/pipeline/field_mapping.rs)
                pipeline="$pipeline test_pipeline_romeo_b0 test_pipeline_unwrap_bfr_romeo test_pipeline_unwrap_bfr_laplacian_neumann test_pipeline_unwrap_bfr_bestpath test_pipeline_unwrap_bfr_prelude test_pipeline_unwrap_bfr_stage_laplacian test_pipeline_tgv test_pipeline_qsmart test_pipeline_qsmart_tikhonov" ;;
              src/pipeline/bg_removal.rs)
                bgremove="$bgremove test_bgremove_sharp test_bgremove_resharp test_bgremove_vsharp test_bgremove_vsharp_no_deconvolve test_bgremove_pdf test_bgremove_ismv test_bgremove_lbv"
                pipeline="$pipeline test_pipeline_harperella test_pipeline_iharperella" ;;
              src/pipeline/inversion.rs)
                inversion="$inversion test_inversion_tkd test_inversion_tsvd test_inversion_tikhonov test_inversion_tv test_inversion_rts test_inversion_ilsqr test_inversion_star test_inversion_medi test_inversion_nltv"
                combined="$combined test_combined_tgv test_combined_tfi" ;;
              src/pipeline/masking.rs)
                pipeline="$pipeline test_pipeline_masking test_pipeline_two_pass" ;;
              src/pipeline/two_pass.rs) pipeline="$pipeline test_pipeline_two_pass" ;;
              # run_qsmart reports its intermediates through the Observer.
              src/pipeline/observer.rs) pipeline="$pipeline test_pipeline_qsmart test_pipeline_qsmart_tikhonov" ;;
              # The separation stage dispatcher; its integration tests are the χ-sepnet / SUSEP-Net
              # runs and the classical methods it wires.
              src/pipeline/separation.rs) chisep="$chisep chisep_qsmci chisep_relaxometry_qsmci chisep_xsepnet" ;;
              src/pipeline/qsmart.rs)
                pipeline="$pipeline test_pipeline_qsmart test_pipeline_qsmart_tikhonov" ;;
              src/bgremove/iharperella.rs) pipeline="$pipeline test_pipeline_harperella test_pipeline_iharperella" ;;

              # Utils (QSMART components)
              src/utils/multi_echo.rs)
                pipeline="$pipeline test_pipeline_romeo_b0 test_pipeline_unwrap_bfr_romeo test_pipeline_unwrap_bfr_laplacian_neumann test_pipeline_unwrap_bfr_bestpath test_pipeline_unwrap_bfr_prelude test_pipeline_unwrap_bfr_stage_laplacian test_pipeline_tgv test_pipeline_qsmart test_pipeline_qsmart_tikhonov test_robust_echo_combination" ;;
              src/utils/vasculature.rs|src/utils/frangi.rs|src/utils/curvature.rs|src/utils/qsmart.rs)
                pipeline="$pipeline test_pipeline_qsmart test_pipeline_qsmart_tikhonov" ;;
              src/utils/bias_correction.rs)
                pipeline="$pipeline test_pipeline_qsmart test_pipeline_qsmart_tikhonov test_bias_correction test_swi" ;;
              # R2PRIMEnet's input is an ARLO R2* fit, so its tests ride on this too.
              src/utils/r2star.rs)
                pipeline="$pipeline test_r2star_t2star"
                chisep="$chisep chisep_r2primenet"; dl="$dl test_dl_r2primenet" ;;
              src/swi.rs) pipeline="$pipeline test_swi test_smwi" ;;

              # Shared by nearly every algorithm: the complex type and FFT helpers, the mask
              # helpers most inversions call, the parallel-iteration macros, NIfTI I/O (every
              # test loads its data through it).
              src/utils/complex.rs|src/utils/mask.rs|src/par.rs|src/io.rs)
                echo "Shared file changed: $file → all tests"
                output_all; exit 0 ;;
              # The error type: no behaviour; the unit tests (already selected) cover it.
              src/error.rs) : ;;
              # EPG / Gibbs unringing are exercised by relaxometry-demo.yml, which posts its own
              # comment and is selected by its own paths filter.
              src/utils/epg.rs|src/utils/gibbs.rs) : ;;
              # N4 bias correction: its ANTs parity (tests/n4_ants_parity.rs) runs in unit-tests.yml.
              src/utils/n4.rs) pipeline="$pipeline test_n4_bias_correction" ;;

              # The integration tests themselves. Adding tests only runs the tests added (routed by
              # name to their matrix); any edit or removal can touch a shared helper, so it reruns
              # every test in the file.
              tests/integration_tests.rs)
                if has_removals tests/integration_tests.rs; then
                  bgremove="$bgremove $(echo "$all_bgremove" | jq -r '.[]' | tr '\n' ' ')"
                  inversion="$inversion $(echo "$all_inversion" | jq -r '.[]' | tr '\n' ' ')"
                  combined="$combined $(echo "$all_combined" | jq -r '.[]' | tr '\n' ' ')"
                  pipeline="$pipeline $(echo "$all_pipeline" | jq -r '.[]' | tr '\n' ' ')"
                  run_bet=true
                else
                  added=$(git diff "$BASE_SHA"..."$HEAD_SHA" -- tests/integration_tests.rs \
                    | grep -E '^\+' | grep -oE 'fn test_[a-z0-9_]+' | sed 's/^fn //' | sort -u || true)
                  echo "integration_tests.rs: additions only → ${added:-none}"
                  for t in $added; do
                    if echo "$all_bgremove" | jq -e --arg t "$t" 'index($t)' >/dev/null; then bgremove="$bgremove $t"
                    elif echo "$all_inversion" | jq -e --arg t "$t" 'index($t)' >/dev/null; then inversion="$inversion $t"
                    elif echo "$all_combined" | jq -e --arg t "$t" 'index($t)' >/dev/null; then combined="$combined $t"
                    elif echo "$all_pipeline" | jq -e --arg t "$t" 'index($t)' >/dev/null; then pipeline="$pipeline $t"
                    elif [ "$t" = test_bet ]; then run_bet=true
                    fi
                  done
                fi ;;
              # Test binaries no workflow job runs (reference-parity, local-data and wasm tests):
              # their non-ignored tests run in unit-tests.yml, which every tests/ change selects.
              tests/amppe_qsmci.rs|tests/chisep_integration.rs|tests/crosscheck.rs|tests/ilsqr_sti_parity.rs|tests/star_sti_parity.rs|tests/n4_ants_parity.rs) : ;;
              tests/models_onnx.rs|tests/qsmart_validation.rs|tests/relaxometry_demo.rs|tests/wasm_pipeline.rs) : ;;
              tests/weight_provider.rs|tests/data/*) : ;;
              # Reporting only: how results are drawn and tabled, never what is computed.
              scripts/render_slices.py|scripts/render_paper_figures.py|scripts/integration_report.sh|scripts/post_pr_comment.sh) : ;;

              # Anything else under src/ or tests/ has no mapping above — a new file, most likely.
              # Run everything rather than nothing: a change that maps to no test must not pass
              # unexercised. Give it a mapping above to narrow it.
              src/*|tests/*)
                echo "Unmapped file changed: $file → all tests (add it to the path map)"
                output_all; exit 0 ;;
            esac
          done

          # Deduplicate and format as JSON arrays
          to_json() {
            local items
            items=$(echo "$@" | tr ' ' '\n' | sort -u | grep -v '^$' || true)
            if [ -z "$items" ]; then
              echo '[]'
              return
            fi
            echo "$items" | jq -R . | jq -s -c .
          }

          bgremove_json=$(to_json $bgremove)
          inversion_json=$(to_json $inversion)
          combined_json=$(to_json $combined)
          pipeline_json=$(to_json $pipeline)
          chisep_json=$(to_json $chisep)
          dl_json=$(to_json $dl)

          has_items() { [ "$1" != '[]' ] && echo true || echo false; }

          echo "run_unit_tests=$run_unit_tests" >> "$GITHUB_OUTPUT"
          echo "run_bgremove=$(has_items "$bgremove_json")" >> "$GITHUB_OUTPUT"
          echo "bgremove_matrix=$bgremove_json" >> "$GITHUB_OUTPUT"
          echo "run_inversion=$(has_items "$inversion_json")" >> "$GITHUB_OUTPUT"
          echo "inversion_matrix=$inversion_json" >> "$GITHUB_OUTPUT"
          echo "run_bet=$run_bet" >> "$GITHUB_OUTPUT"
          echo "run_combined=$(has_items "$combined_json")" >> "$GITHUB_OUTPUT"
          echo "combined_matrix=$combined_json" >> "$GITHUB_OUTPUT"
          echo "run_pipeline=$(has_items "$pipeline_json")" >> "$GITHUB_OUTPUT"
          echo "pipeline_matrix=$pipeline_json" >> "$GITHUB_OUTPUT"
          echo "run_chisep=$(has_items "$chisep_json")" >> "$GITHUB_OUTPUT"
          echo "chisep_matrix=$chisep_json" >> "$GITHUB_OUTPUT"
          echo "run_dl=$(has_items "$dl_json")" >> "$GITHUB_OUTPUT"
          echo "dl_matrix=$dl_json" >> "$GITHUB_OUTPUT"
          echo "run_geometry=$run_geometry" >> "$GITHUB_OUTPUT"
          echo "run_multislice=$run_multislice" >> "$GITHUB_OUTPUT"

          echo "Selected tests:"
          echo "  bgremove:  $bgremove_json"
          echo "  inversion: $inversion_json"
          echo "  bet:       $run_bet"
          echo "  combined:  $combined_json"
          echo "  pipeline:  $pipeline_json"
          echo "  chisep:    $chisep_json"
          echo "  dl:        $dl_json"
          echo "  geometry:  $run_geometry"
          echo "  2d slices: $run_multislice"

      # Which wasm32 shards unit-tests.yml runs. `classical` runs whenever the unit tests do; the
      # three deep-learning shards only for a change their networks can see (see
      # scripts/wasm_dl_shards.py). Everything runs on a manual run, under the `run-all-tests`
      # label, on any event that is not a pull request, and when the changed files are unknown.
      - name: Select wasm32 shards
        id: wasm
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          all='["stages","masking","segmentation"]'
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "$EVENT_NAME: every wasm32 shard"
            dl=$all
          elif echo "${PR_LABELS:-[]}" | jq -e 'index("run-all-tests")' >/dev/null 2>&1; then
            echo "run-all-tests label: every wasm32 shard"
            dl=$all
          elif [ ! -f "$RUNNER_TEMP/changed-files" ]; then
            echo "Changed files unknown: every wasm32 shard"
            dl=$all
          else
            python3 scripts/wasm_dl_shards.py select --from "$RUNNER_TEMP/changed-files" | tee wasm-select.log
            dl=$(tail -n 1 wasm-select.log)
          fi
          shards=$(jq -c '["classical"] + .' <<< "$dl")
          echo "wasm32 shards: $shards"
          echo "wasm_shards=$shards" >> "$GITHUB_OUTPUT"

  # Unit tests + code coverage (reusable workflow)
  unit-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.run_unit_tests == 'true'
    uses: ./.github/workflows/unit-tests.yml
    with:
      wasm_shards: ${{ needs.detect-changes.outputs.wasm_shards }}

  # Download test data once and cache it
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache test data
        id: cache-testdata
        uses: actions/cache@v4
        with:
          path: bids
          # Bump this key whenever the OSF bundle changes. It carries no content hash, so a
          # replaced bids.zip is otherwise masked by every existing runner cache — the download
          # is skipped, the stale bundle is served, and the tests that needed the new data skip
          # while reporting success.
          # v2 (2026-10-06): added the 2D multi-slice sessions ses-thick / ses-offsets / ses-gap
          # (qsm-forward examples/multislice_2d.py), for tests/multislice_2d.rs.
          key: testdata-v2-y8adf

      - name: Download test data from OSF
        if: steps.cache-testdata.outputs.cache-hit != 'true'
        env:
          OSF_TOKEN: ${{ secrets.OSF_TOKEN }}
        run: |
          # Download from private OSF project y8adf using waterbutler API
          curl -L -H "Authorization: Bearer ${OSF_TOKEN}" \
            "https://files.osf.io/v1/resources/y8adf/providers/osfstorage/698ac9aecae88916d1e24f69" \
            -o bids.zip
          unzip -q bids.zip
          rm bids.zip
          ls -la bids/

      - name: Upload test data artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-data
          path: bids
          retention-days: 1

  # Download the χ-separation phantom (a different dataset from the BIDS forward
  # data: it ships χ+/χ− ground truth, R2' and spin-echo magnitude) and publish it
  # as its own artifact for the chisep-tests jobs.
  setup-chisep:
    needs: detect-changes
    if: needs.detect-changes.outputs.run_chisep == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Cache chisep data
        id: cache-chisep
        uses: actions/cache@v4
        with:
          path: qsmci-chisep
          # Bump the key whenever the OSF dataset changes (no content hash; see the setup job).
          # v2 (2026-10-19): forces a real download so the WaterButler fix below is exercised.
          key: chisep-data-v2-y8adf

      - name: Download chisep phantom from OSF
        if: steps.cache-chisep.outputs.cache-hit != 'true'
        env:
          OSF_TOKEN: ${{ secrets.OSF_TOKEN }}
          OSF_FILE_CHISEP: ${{ secrets.OSF_FILE_CHISEP }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.request

          token = os.environ["OSF_TOKEN"]
          override = os.environ.get("OSF_FILE_CHISEP", "").strip()

          def api(url):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          # Download through WaterButler (files.osf.io/v1/resources/<node>/providers/osfstorage/<id>,
          # the file's `upload` link), never `links.download` (osf.io/download/<guid>). WaterButler
          # authorises the Bearer token and 302s to a pre-signed object-storage URL. curl -L drops
          # the Authorization header on that cross-host redirect, as the signed URL requires: the
          # storage backend rejects a signed request that also carries a Bearer header with
          # 400 "authorization mechanism ... not supported". The osf.io/download/<guid> link needs
          # one more hop, osf.io -> files.osf.io, which with -L loses the token (private project:
          # 403), and with --location-trusted carries it all the way to storage (400).
          url = None
          if override:
              # File id (24 hex) or GUID: resolve to its WaterButler link through the API.
              url = api(f"https://api.osf.io/v2/files/{override}/")["data"]["links"]["upload"]
              print(f"using pinned OSF_FILE_CHISEP -> {url}")
          else:
              # Walk the project's osfstorage and take the first chisep zip.
              stack = ["https://api.osf.io/v2/nodes/y8adf/files/osfstorage/?page%5Bsize%5D=100"]
              while stack and url is None:
                  page = stack.pop()
                  while page:
                      d = api(page)
                      for f in d["data"]:
                          a = f["attributes"]
                          if a["kind"] == "folder":
                              stack.append(
                                  f["relationships"]["files"]["links"]["related"]["href"]
                                  + "?page%5Bsize%5D=100"
                              )
                          elif "chisep" in a["name"].lower() and a["name"].lower().endswith(".zip"):
                              url = f["links"]["upload"]
                              print(f"found {a['materialized_path']} ({a['size']} bytes) -> {url}")
                              break
                      if url:
                          break
                      page = d["links"].get("next")
          if not url:
              sys.exit(
                  "No chisep *.zip found on OSF project y8adf. "
                  "Set the OSF_FILE_CHISEP secret to the dataset's file id or GUID."
              )
          with open("osf_url.txt", "w") as fh:
              fh.write(url)
          EOF
          # -L, not --location-trusted: see the WaterButler note above.
          curl -fSL -H "Authorization: Bearer ${OSF_TOKEN}" "$(cat osf_url.txt)" -o chisep.zip
          mkdir -p qsmci-chisep
          unzip -q chisep.zip -d qsmci-chisep
          # Prepacked zips are flattened (inputs/ + groundtruth/ at the root),
          # but tolerate one extra directory level.
          if [ ! -f qsmci-chisep/inputs/localfield.nii.gz ]; then
            # `|| true`: `head -1` closing the pipe early SIGPIPEs `find` under pipefail. The
            # emptiness check on the next line is what actually reports "not found".
            inner=$(dirname "$(find qsmci-chisep -name localfield.nii.gz -path '*/inputs/*' | head -1 || true)")
            [ -n "$inner" ] || { echo "localfield.nii.gz not found in dataset zip"; exit 1; }
