          path: slices/
          retention-days: 1

  bet-test:
    needs: [setup, detect-changes]
    if: needs.detect-changes.outputs.run_bet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download test data
