name: Regenerate fixtures

# Regenerates parity fixtures in tests/data from the original implementations' verified QSM-CI
# containers (astewartau/QSM.rs#317), and checks that they reproduce the committed files.
#
# A fixture `tests/data/<name>.bin` can be regenerated here when it has a generator next to it:
# - `tests/data/<name>.py`, which builds the inputs, runs the container (pinned by digest in the
#   script) itself and writes the .bin: `python3 tests/data/<name>.py <out.bin>`;
# - `tests/data/<name>.jl`, run inside the verified Julia image by the `podman run ...` command in
#   its header (run here with docker, writing the .bin elsewhere).
# A run fails if the result differs from the committed .bin, and uploads it either way (artifact
# `fixture-<name>`), so a fixture that should change (a new container digest, new cases) is
# replaced from that artifact. A generator whose header has a line starting `# machine-dependent:`
# makes an original whose output rounds differently on different CPUs (the line says by how
# much); for those a mismatch is a warning. `.m` generators need licensed MATLAB and are not run.
#
# Runs on demand for one fixture, and on pull requests for every generator they add or change.

on:
  workflow_dispatch:
    inputs:
      fixture:
        description: "Fixture name: tests/data/<name>.py or .jl, and .bin (e.g. star_sti_qsmci_small)"
        type: string
        required: true
  pull_request:
    paths:
      - "tests/data/*.py"
      - "tests/data/*.jl"
      - ".github/workflows/regenerate-fixtures.yml"

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      fixtures: ${{ steps.list.outputs.fixtures }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fixtures to regenerate
        id: list
        env:
          INPUT: ${{ inputs.fixture }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$INPUT" ]; then
            names="$INPUT"
          else
            # Generators the pull request adds or changes.
            names=$(git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'tests/data/*.py' 'tests/data/*.jl' | sed 's|tests/data/||; s|\.[a-z]*$||' | sort -u)
          fi
          json=$(for n in $names; do
            [[ "$n" =~ ^[A-Za-z0-9_]+$ ]] || { echo "::error::bad fixture name '$n'" >&2; exit 1; }
            { [ -f "tests/data/$n.py" ] || [ -f "tests/data/$n.jl" ]; } && [ -f "tests/data/$n.bin" ] \
              || { echo "::error::no tests/data/$n.py or .jl, and .bin" >&2; exit 1; }
            echo "$n"
          done | jq -R . | jq -cs .)
          echo "fixtures=$json" >> "$GITHUB_OUTPUT"
          echo "fixtures: $json"

  regenerate:
    needs: list
    if: needs.list.outputs.fixtures != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: ${{ fromJSON(needs.list.outputs.fixtures) }}
    env:
      NAME: ${{ matrix.fixture }}
    steps:
      - uses: actions/checkout@v4

      # The MATLAB Runtime images are ~11 GB; the runner starts with ~20 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned: numpy builds the inputs (its FFT for the dipole fields), so another version may
      # round them differently and the comparison below would flag that.
      - name: Install numpy and nibabel
        run: pip install numpy==2.5.4 nibabel==5.4.2

      - name: Generate
        env:
          CONTAINER_ENGINE: docker
        run: |
          mkdir -p regenerated
          if [ -f "tests/data/$NAME.py" ]; then
            python3 "tests/data/$NAME.py" "regenerated/$NAME.bin"
          else
            # The header's `podman run ... /data/<name>.jl /data/<name>.bin`, with docker, as this
            # user, writing to regenerated/ instead.
            cmd=$(sed -n '/^#   podman run/,/\.bin$/p' "tests/data/$NAME.jl" | sed 's/^#[[:space:]]*//; s/\\$//' | tr '\n' ' ')
            [ -n "$cmd" ] || { echo "::error::no 'podman run' command in tests/data/$NAME.jl's header"; exit 1; }
            cmd=${cmd/podman run/docker run --user $(id -u):$(id -g) -v $PWD/regenerated:/out}
            cmd=${cmd/\/data\/$NAME.bin//out/$NAME.bin}
            echo "$cmd"
            eval "$cmd"
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-${{ matrix.fixture }}
          path: regenerated/
          if-no-files-found: ignore

      - name: Compare with the committed fixture
        run: |
          if cmp "regenerated/$NAME.bin" "tests/data/$NAME.bin"; then
            echo "tests/data/$NAME.bin reproduced exactly"
          elif grep -qs '^# machine-dependent:' tests/data/"$NAME".py tests/data/"$NAME".jl; then
            echo "::warning::tests/data/$NAME.bin differs from the regenerated one (artifact fixture-$NAME); its original is machine-dependent (see the generator's header)"
          else
            echo "::error::tests/data/$NAME.bin differs from the regenerated one (artifact fixture-$NAME)"
            exit 1
          fi
