[package]
name = "qsm-core"
version = "0.0.0" # Set automatically by release workflow from git tag
edition = "2021"
description = "Core QSM (Quantitative Susceptibility Mapping) algorithms"
homepage = "https://astewartau.github.io/QSM.rs/"
repository = "https://github.com/astewartau/QSM.rs"
documentation = "https://astewartau.github.io/QSM.rs/api/qsm_core/"
license = "MIT"
keywords = ["qsm", "mri", "neuroimaging", "susceptibility", "medical-imaging"]
categories = ["science", "algorithms"]

[lib]
crate-type = ["rlib"]

[features]
default = []
# (with `onnx`, also multithreads tract's matrix kernels — see `models::onnx`)
parallel = ["rayon", "tract-linalg?/multithread-mm"]
simd = ["wide"]
# Derives Serialize on the *Params structs (off by default — they are not
# serde config types). Used only by downstream tests to introspect field names
# and verify the qsmxt-config wrapper layer covers every parameter.
introspection = ["dep:serde"]
# Native "download on use" of deep-learning model weights (HTTP + SHA-256 cache).
# Not used by WASM hosts, which fetch weights in JavaScript instead.
download = ["dep:ureq", "dep:sha2"]
# ONNX inference for deep-learning models via the pure-Rust `tract` engine.
# Byte-buffer based, so it compiles for both native and WASM targets.
onnx = ["dep:tract-onnx", "dep:tract-linalg"]

# Lint configuration for the clippy gate in `.github/workflows/unit-tests.yml`, which runs
# `--all-targets -D warnings`. A `[lints]` table is used rather than crate-level `#![allow]`
# attributes because it covers every target in the package -- the integration tests under
# `tests/` are separate crates, and would otherwise each need their own copy.
#
# Both allows below are deliberate and were weighed in #148 against the alternative of
# rewriting the ~190 sites they cover. Anything outside these two is expected to be fixed
# rather than allowed, and a new `#[allow]` anywhere in the tree should carry a comment
# saying why.
[lints.clippy]
# 144 occurrences. The lint assumes an index exists only to reach an element, so iterating
# the slice directly would say the same thing more clearly. That does not hold in indexing
# heavy numerical code, where the index is usually itself a quantity in the maths:
#   - `fft.rs::fftfreq` computes `freq[i] = (i as f64) * val`, so `i` is the frequency,
#     not merely where the frequency goes.
#   - `kernels/dipole.rs` walks `nx`/`ny`/`nz` reading three separate axis arrays and
#     writing one flat Fortran-order buffer, so no single slice is "the" iteration target.
#   - `inversion/tgv.rs` reads `stencil_positions[p]` and `stencil_positions[25 - p]` in the
#     same body, which an iterator cannot express without reintroducing the index.
# Rewriting these makes the correspondence to the published algorithms harder to check,
# which is the property that matters most in this crate.
needless_range_loop = "allow"
# 46 occurrences, 36 of which were examined and accepted during the API refactor that moved
# these signatures to `&Grid` and `&*Params` structs. The remainder are the same shape: the
# numerical kernels take the parameters the algorithms are defined in terms of. The lint's
# threshold of 7 is not meaningful for them, and grouping arguments further purely to satisfy
# it would add indirection without making any caller clearer.
too_many_arguments = "allow"

[dependencies]
# FFT and complex number support
rustfft = "6.2"
num-complex = "0.4"
num-traits = "0.2"

# NIfTI file support
nifti = { version = "0.17", default-features = false, features = ["ndarray_volumes"] }
ndarray = "0.16"
flate2 = "1.1"
bytemuck = "1.24"

# Parallelism (optional)
rayon = { version = "1", optional = true }

# SIMD acceleration (optional)
wide = { version = "0.7", optional = true }

# 2D Delaunay triangulation for curvature calculation
delaunator = "1.0"

# Serde derive, only linked when the `introspection` feature is on (see [features]).
serde = { version = "1", features = ["derive"], optional = true }

# Deep-learning model weights: HTTP download + checksum (see the `download` feature).
ureq = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }

# ONNX inference engine, pure Rust so it also compiles to WASM (see `onnx` feature).
tract-onnx = { version = "0.23", optional = true }
# tract's kernel crate, named directly only so `parallel` can switch on its multithreaded executor
# (resolves to the same version tract-onnx uses; WASM builds without `parallel` stay single-threaded).
tract-linalg = { version = "0.23", optional = true }
rustdct = "0.7.1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Both of these drive ONNX models, so they do not build with the default feature
# set; without this cargo tries to compile them for `--all-targets` and fails.
# `download` is deliberately NOT required: each falls back to a local weights
# file or $QSM_MODEL_DIR, so they stay buildable without the HTTP stack.
[[example]]
name = "synthseg_run"
required-features = ["onnx"]

[[example]]
name = "xqsm_tiled_check"
required-features = ["onnx"]
